<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0c0a12" />
<title>The Vault of Us</title>
<style>
  :root{
    --bg:#0c0a12;
    --panel:#161120;
    --gold:#d9b36c;
    --gold-dim:rgba(217,179,108,.32);
    --gold-faint:rgba(217,179,108,.12);
    --cream:#f3e9d6;
    --muted:#a99d8a;
    --rose:#e79aa6;
    --ink:#241a09;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(60% 45% at 20% 0%, rgba(88,58,120,.28), transparent 70%),
      radial-gradient(50% 40% at 85% 15%, rgba(217,179,108,.10), transparent 70%),
      radial-gradient(70% 55% at 50% 110%, rgba(120,44,66,.22), transparent 70%),
      var(--bg);
  }
  #stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
  #stars i{
    position:absolute;width:2px;height:2px;border-radius:50%;
    background:rgba(243,233,214,.7);
    animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.7}}

  .screen{
    max-width:520px;margin:0 auto;min-height:100dvh;
    display:flex;flex-direction:column;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom));
    animation:screenIn .45s ease both;
  }
  @keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .serif{font-family:Georgia,'Times New Roman',serif}
  .eyebrow{
    letter-spacing:.28em;text-transform:uppercase;font-size:11px;
    color:var(--gold);opacity:.9;
  }
  h1.title{font-family:Georgia,serif;font-weight:normal;font-size:38px;line-height:1.15;margin:14px 0 10px}
  .sub{color:var(--muted);font-size:15px;line-height:1.6}

  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .back{
    width:38px;height:38px;border-radius:50%;flex:0 0 auto;
    border:1px solid var(--gold-dim);background:rgba(255,255,255,.04);
    color:var(--gold);font-size:20px;line-height:1;cursor:pointer;
  }
  .topbar .crumb{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .topbar .crumb b{display:block;letter-spacing:0;text-transform:none;color:var(--cream);font-size:16px;font-family:Georgia,serif;font-weight:normal;margin-top:2px}

  .btn{
    appearance:none;border:none;cursor:pointer;
    background:linear-gradient(180deg,#e8c684,#c99f55);
    color:var(--ink);font-weight:600;font-size:16px;
    padding:14px 22px;border-radius:999px;
    box-shadow:0 6px 24px rgba(217,179,108,.25);
    transition:transform .15s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn.small{padding:11px 18px;font-size:15px}
  .btn.ghost{
    background:transparent;color:var(--gold);
    border:1px solid var(--gold-dim);box-shadow:none;font-weight:500;
  }
  .linkish{
    background:none;border:none;color:var(--muted);cursor:pointer;
    font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px;
  }

  /* ── gate ── */
  .gate{justify-content:center;text-align:center;gap:6px}
  .dial-wrap{margin:0 auto 26px;position:relative;width:190px;height:190px}
  .dial{
    width:100%;height:100%;border-radius:50%;position:relative;
    border:3px solid var(--gold-dim);
    background:radial-gradient(circle at 35% 30%, #2b2238, #120f19 72%);
    box-shadow:0 0 70px rgba(217,179,108,.14), inset 0 0 40px rgba(0,0,0,.65);
    transition:transform .3s ease;
  }
  .dial::before{
    content:'';position:absolute;inset:26px;border-radius:50%;
    border:2px solid var(--gold-dim);
    background:conic-gradient(from 12deg,
      transparent 0 29%, var(--gold-dim) 29% 31%,
      transparent 31% 62%, var(--gold-dim) 62% 64%,
      transparent 64% 95%, var(--gold-dim) 95% 97%, transparent 97%);
  }
  .dial::after{
    content:'';position:absolute;inset:74px;border-radius:50%;
    background:radial-gradient(circle at 38% 32%, #f0d49a, var(--gold) 60%);
    box-shadow:0 0 26px rgba(217,179,108,.55);
  }
  .opening .dial{animation:dialSpin 2s cubic-bezier(.65,0,.3,1) forwards}
  @keyframes dialSpin{
    60%{transform:rotate(680deg) scale(1.04);filter:brightness(1.25)}
    100%{transform:rotate(720deg) scale(1.5);filter:brightness(2.2);opacity:0}
  }

  /* ── map ── */
  .keycount{
    display:inline-flex;align-items:center;gap:8px;margin-top:10px;
    border:1px solid var(--gold-dim);border-radius:999px;
    padding:7px 14px;font-size:13px;color:var(--gold);background:var(--gold-faint);
  }
  .days{display:flex;flex-direction:column;gap:14px;margin-top:26px}
  .day-card{
    border:1px solid var(--gold-dim);border-radius:20px;
    background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    padding:18px;cursor:pointer;text-align:left;color:inherit;
    display:flex;align-items:center;gap:14px;width:100%;
    transition:transform .15s ease,border-color .2s;
  }
  .day-card:active{transform:scale(.985)}
  .day-card.locked{opacity:.45;cursor:default}
  .day-card .glyph{font-size:26px;flex:0 0 auto}
  .day-card .d-eyebrow{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
  .day-card h3{font-family:Georgia,serif;font-weight:normal;font-size:20px;margin:3px 0 4px}
  .day-card p{font-size:13px;color:var(--muted);line-height:1.5}
  .dots{display:flex;gap:5px;margin-top:9px}
  .dots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--gold-dim)}
  .dots i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(217,179,108,.6)}
  .foot{margin-top:auto;padding-top:30px;text-align:center;font-size:12px;color:var(--muted)}

  /* ── day / lock lists ── */
  .epigraph{font-family:Georgia,serif;font-style:italic;color:var(--muted);font-size:15px;line-height:1.6;margin:4px 0 20px}
  .locks{display:flex;flex-direction:column;gap:12px}
  .lock-row{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:inherit;
    border:1px solid rgba(255,255,255,.09);border-radius:16px;
    background:rgba(255,255,255,.03);padding:16px;cursor:pointer;
  }
  .lock-row.done{border-color:var(--gold-dim);background:var(--gold-faint)}
  .lock-row.locked{opacity:.4;cursor:default}
  .lock-row .num{
    width:34px;height:34px;border-radius:50%;flex:0 0 auto;
    border:1px solid var(--gold-dim);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-family:Georgia,serif;
  }
  .lock-row h4{font-size:16px;font-weight:500;margin-bottom:2px}
  .lock-row p{font-size:12.5px;color:var(--muted)}
  .lock-row .state{margin-left:auto;font-size:18px}

  /* ── chat ── */
  .chat{display:flex;flex-direction:column;gap:4px;padding-bottom:16px;flex:1}
  .bubble{
    max-width:86%;padding:12px 16px;border-radius:18px;margin:5px 0;
    font-size:15.5px;line-height:1.55;
    animation:pop .4s ease both;white-space:pre-wrap;word-wrap:break-word;
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .bubble.them{
    align-self:flex-start;background:rgba(255,255,255,.06);
    border:1px solid rgba(217,179,108,.16);border-bottom-left-radius:6px;
  }
  .bubble.you{
    align-self:flex-end;background:linear-gradient(180deg,#e4c07c,#c69c52);
    color:var(--ink);border-bottom-right-radius:6px;
  }
  .bubble.typing{min-width:64px}
  .bubble.typing i{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--muted);margin:0 3px;animation:blink 1.1s infinite;
  }
  .bubble.typing i:nth-child(2){animation-delay:.18s}
  .bubble.typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
  .hint-tap{text-align:center;font-size:11.5px;color:rgba(169,157,138,.6);padding:4px 0 8px}

  .dock{
    position:sticky;bottom:0;padding:12px 0 4px;
    background:linear-gradient(180deg, transparent, var(--bg) 30%);
    display:flex;flex-direction:column;gap:10px;
  }
  .dock-row{display:flex;gap:10px}
  .inp,.ta{
    flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(217,179,108,.25);
    border-radius:16px;color:var(--cream);font-size:16px;padding:13px 16px;outline:none;
    font-family:inherit;
  }
  .inp:focus,.ta:focus{border-color:var(--gold)}
  .ta{resize:none;min-height:96px;line-height:1.5}
  .shake{animation:shake .45s ease}
  @keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

  /* ── ceremony seal ── */
  .seal-zone{display:flex;flex-direction:column;align-items:center;gap:16px;padding:18px 0}
  .seal{
    --p:0%;
    width:150px;height:150px;border-radius:50%;cursor:pointer;
    background:conic-gradient(var(--gold) var(--p), rgba(255,255,255,.09) 0);
    padding:5px;transition:filter .2s;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
    border:none;touch-action:none;
  }
  .seal>span{
    display:flex;width:100%;height:100%;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #3a2530, #1b1119 70%);
    align-items:center;justify-content:center;font-size:44px;
    border:1px solid rgba(217,179,108,.3);
  }
  .seal:active{filter:brightness(1.25)}
  .seal-label{font-size:13px;color:var(--muted)}

  /* ── memory card ── */
  .memory{justify-content:center}
  .memory-card{
    border:1px solid var(--gold-dim);border-radius:22px;padding:30px 24px;
    background:
      radial-gradient(120% 100% at 50% 0%, rgba(217,179,108,.10), transparent 55%),
      linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  .memory-card .m-eyebrow{text-align:center;letter-spacing:.3em;text-transform:uppercase;font-size:10.5px;color:var(--gold)}
  .memory-card h2{
    font-family:Georgia,serif;font-weight:normal;text-align:center;
    font-size:26px;margin:12px 0 6px;
  }
  .m-rule{width:52px;height:1px;background:var(--gold-dim);margin:14px auto 20px}
  .mline{
    font-family:Georgia,serif;font-size:17px;line-height:1.75;color:var(--cream);
    margin-bottom:14px;opacity:0;animation:mIn .8s ease forwards;
  }
  @keyframes mIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .key-toast{
    display:flex;align-items:center;justify-content:center;gap:9px;
    margin:22px auto 0;padding:10px 18px;width:fit-content;
    border:1px solid var(--gold-dim);border-radius:999px;background:var(--gold-faint);
    color:var(--gold);font-size:14px;opacity:0;animation:mIn .8s ease forwards;
  }
  .after-card{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:26px;opacity:0;animation:mIn .8s ease forwards}

  /* ── finale ── */
  .keyholes{display:flex;gap:9px;justify-content:center;margin:22px 0}
  .keyholes i{
    width:13px;height:13px;border-radius:50%;border:1px solid var(--gold-dim);
  }
  .keyholes i.on{background:var(--gold);box-shadow:0 0 10px rgba(217,179,108,.7)}
  .invite{
    border:1px solid var(--gold);border-radius:20px;padding:24px;margin-top:22px;
    background:var(--gold-faint);
  }
  .invite .row{display:flex;gap:14px;padding:9px 0;border-bottom:1px dashed rgba(217,179,108,.25);font-size:15.5px}
  .invite .row:last-child{border-bottom:none}
  .invite .k{color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:11px;flex:0 0 74px;padding-top:3px}
  .invite .v{font-family:Georgia,serif;font-size:16.5px;line-height:1.5}

  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .hearts span{position:absolute;bottom:-36px;animation:rise 3.6s ease-in forwards;opacity:.9}
  @keyframes rise{to{transform:translateY(-112vh) rotate(24deg);opacity:0}}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:#241d31;border:1px solid var(--gold-dim);color:var(--cream);
    border-radius:999px;padding:11px 20px;font-size:14px;z-index:60;
    animation:pop .3s ease both;box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<div id="stars"></div>
<div id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   THE VAULT OF US — personalization lives entirely in this VAULT object.
   Every line marked ✏️ is yours to rewrite. See vault-of-us/README.md for
   the map of the 10 questions → the fields below.
   Test with index.html?preview (ignores every date/time gate), then open
   index.html?reset to wipe all progress before gifting.
   ═══════════════════════════════════════════════════════════════════════ */
const VAULT = {

  herName: "",                      // ✏️ her name — the vault will only open for her. Leave "" to skip the name gate.
  yourName: "Jimil",                // ✏️ how you sign the final letter
  relationshipLength: "1 year and 5 months",

  /* ── THE FOUR-DAY SCHEDULE ──
     The game is paced across four real days, and each lock inside a day
     stays sealed until its `opensAt` time of day.
     • startDate "" (default): Day 1 is whatever day she first opens the
       vault; Day 2 is the next day, Day 3 the day after, Day 4 after that.
     • startDate "2026-07-20": pin Day 1 to an exact date instead.
     Days also unlock in order — Day 2 needs Day 1 finished, etc.
     While testing, index.html?preview ignores every date/time gate. */
  startDate: "",                    // ✏️ "" = starts the day she first opens it, or pin e.g. "2026-07-20"

  days: [

  /* ─────────────── DAY 1 · THE BEGINNING ─────────────── */
  {
    title: "The Beginning",
    tagline: "How we became us.",
    glyph: "🌱",
    epigraph: "✏️ [One line about how you two met — Q1. e.g. \"It started with a borrowed pen and a terrible excuse to talk to you.\"]",
    opensOn: "",                    // optional: pin THIS day to an exact "YYYY-MM-DD" (overrides startDate)
    locks: [
      {
        id: "moment-i-knew",
        type: "guesses",
        opensAt: "09:00",           // ✏️ Day 1 — the morning key
        title: "The Moment I Knew",
        teaser: "Three guesses. One moment.",
        lines: [
          "There's one moment I revisit more than any other.",
          "It isn't our first conversation.",
          "It isn't the day we started dating.",
          "It isn't even our first date.",
          "It's the first moment I thought —",
          "“She's going to be someone really important to me.”",
          "You get three guesses. Think like me, not like a quiz. 🙂"
        ],
        placeholder: "What moment was it…?",
        maxGuesses: 3,
        guessResponses: [
          "Mmm. That one's close to my heart too… but it's not the one. Two more. 🙂",
          "I love that you thought of that. Still no. One more guess — make it count.",
          "Okay. Come here. Let me tell you."
        ],
        reveal: {
          title: "The Moment I Knew",
          lines: [
            "✏️ [Tell her the exact moment — where you were, what she was doing, the precise second it hit you. Small details win: what she was wearing, what she said, the sound in the room.]",
            "✏️ [And the part she doesn't know: \"I never told you this, but I replayed that moment in my head for days afterward.\"]"
          ]
        }
      },
      {
        id: "five-minutes-before",
        type: "story",
        opensAt: "14:00",           // ✏️ Day 1 — the afternoon key
        title: "Five Minutes Before",
        teaser: "You'll need your gallery for this one.",
        lines: [
          "Open your gallery.",
          "Scroll all the way back. Keep going.",
          "Find the oldest picture of us that exists.",
          "Don't send it to me. I know exactly which one it is.",
          "Instead…",
          "Tell me what happened five minutes before it was taken."
        ],
        placeholder: "Five minutes before that photo…",
        minLength: 40,
        nudge: "Take your time. I don't want the caption — I want the scene. 🙂",
        reveal: {
          title: "Five Minutes Before",
          lines: [
            "Now my turn.",
            "✏️ [Write what YOU remember about the five minutes before that photo — especially the detail she doesn't know you noticed. Were you nervous? Watching her? Trying to look calm?]"
          ]
        }
      },
      {
        id: "the-confession",
        type: "guesses",
        opensAt: "20:00",           // ✏️ Day 1 — the evening key
        title: "The Confession",
        teaser: "You were there. But you don't know all of it.",
        lines: [
          "Before anything was official, somebody had to say it first.",
          "You know who confessed. You were there. 🙂",
          "But here's what you don't know…",
          "There's something about that day I've kept to myself for {relationshipLength}.",
          "Guess what it is. Three tries."
        ],
        placeholder: "Hmm… was it that you…",
        maxGuesses: 3,
        guessResponses: [
          "Ha — no. Although now I want to know why you'd think that. Two more.",
          "Warmer. But not quite. Last guess.",
          "Alright, alright. Confession time. Again."
        ],
        reveal: {
          title: "The Confession",
          lines: [
            "✏️ [Q2 — the confession from YOUR side of it: how many times you rehearsed, what you almost said instead, how sure you were that you'd ruined everything, the backup plan you never needed.]"
          ]
        }
      }
    ]
  },

  /* ─────────────── DAY 2 · THE LITTLE THINGS ─────────────── */
  {
    title: "The Little Things",
    tagline: "The tiny moments you don't realize I remember.",
    glyph: "🫙",
    epigraph: "The big days were easy to remember. These are the ones I chose to keep.",
    opensOn: "",                    // optional: pin THIS day to an exact "YYYY-MM-DD" (overrides startDate)
    locks: [
      {
        id: "words-that-stayed",
        type: "guesses",
        opensAt: "09:00",           // ✏️ Day 2 — the morning key
        title: "The Words That Stayed",
        teaser: "You said it casually. I never put it down.",
        lines: [
          "One day, you said something completely casual.",
          "Mid-conversation. Barely thinking about it.",
          "You probably forgot it a minute later.",
          "I never did.",
          "It's been living in my head ever since.",
          "Guess what you said."
        ],
        placeholder: "Did I say…",
        maxGuesses: 3,
        guessResponses: [
          "You've said a lot of great things, but no. 🙂 Two more.",
          "Nope. It was smaller than that. That's your hint. One more.",
          "Okay — listen."
        ],
        reveal: {
          title: "The Words That Stayed",
          lines: [
            "✏️ [Q5 — quote her EXACT words, in quotes. Then: when it was, where you were, and why those words never left you.]"
          ]
        }
      },
      {
        id: "the-adorable-thing",
        type: "guesses",
        opensAt: "14:00",           // ✏️ Day 2 — the afternoon key
        title: "The Thing You Do",
        teaser: "You don't even know you do it.",
        lines: [
          "You have a habit.",
          "You don't know you have it. That's the best part.",
          "And every single time you do it, it undoes me a little.",
          "Guess what it is.",
          "(Be honest with your guesses — I'll know. 🙂)"
        ],
        placeholder: "Is it the way I…",
        maxGuesses: 3,
        guessResponses: [
          "Also adorable, but no. Two left.",
          "You're circling it. One more.",
          "You'd never have guessed it. Here."
        ],
        reveal: {
          title: "The Thing You Do",
          lines: [
            "✏️ [Q8 — the habit she doesn't know she has. Describe it like you're watching her do it right now. End with when you first noticed it.]"
          ]
        }
      },
      {
        id: "only-us",
        type: "passphrase",
        opensAt: "20:00",           // ✏️ Day 2 — the evening key
        title: "Only Us",
        teaser: "This lock has a real answer. Two people know it.",
        lines: [
          "This lock is different from the others.",
          "It has an actual answer.",
          "And there are exactly two people on this planet who know it.",
          "I'm one. You're the other.",
          "✏️ [Q6 — set up your inside joke as a fill-in-the-blank. e.g. \"Finish the sentence: ‘That's not a duck, that's ____.’\"]"
        ],
        placeholder: "Type the answer…",
        accept: [
          "✏️ the answer",
          "✏️ an alternate spelling of the answer"
        ],
        wrongResponses: [
          "Excuse me?? You KNOW this one. 😄",
          "Nope. I'm judging you a little bit right now.",
          "Third strike. Fine — hint incoming."
        ],
        hint: "✏️ [A nudge only she would understand — where were you the first time it happened?]",
        reveal: {
          title: "Only Us",
          lines: [
            "There she is. 😄",
            "✏️ [The origin story of the joke — the first time it happened, told properly, with the details she's forgotten. And what it means to you that you two have a language nobody else speaks.]"
          ]
        }
      }
    ]
  },

  /* ─────────────── DAY 3 · THE FUTURE ─────────────── */
  {
    title: "The Future",
    tagline: "Where we're going.",
    glyph: "🔭",
    epigraph: "The vault isn't just for keeping what happened. It's for keeping what's next.",
    opensOn: "",                    // optional: pin THIS day to an exact "YYYY-MM-DD" (overrides startDate)
    locks: [
      {
        id: "one-memory",
        type: "story",
        opensAt: "09:00",           // ✏️ Day 3 — the morning key
        title: "The One You'd Save",
        teaser: "There is no correct answer.",
        lines: [
          "Imagine you lost all our photos tomorrow.",

/* ═══════════════════════════════════════════════════════════════════════
   ENGINE — you shouldn't need to touch anything below this line.
   ═══════════════════════════════════════════════════════════════════════ */
(function(){
"use strict";

const app = document.getElementById('app');
const STORE = 'vault-of-us-v1';

let state = { entered:false, keys:{}, answers:{} };
try{
  const s = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (s && typeof s === 'object') state = Object.assign(state, s);
}catch(e){}
const QUERY = new URLSearchParams(location.search);
const PREVIEW = QUERY.has('preview'); // ?preview ignores every date/time gate — for his test runs
if (QUERY.has('reset')){
  localStorage.removeItem(STORE);
  state = { entered:false, keys:{}, answers:{} };
  history.replaceState(null, '', location.pathname + (PREVIEW ? '?preview' : ''));
}
const save = () => { try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} };

const fmt = s => String(s)
  .replaceAll('{herName}', VAULT.herName || 'you')
  .replaceAll('{yourName}', VAULT.yourName || 'me')
  .replaceAll('{relationshipLength}', VAULT.relationshipLength || 'all this time');

const ALL_LOCKS = VAULT.days.flatMap(d => d.locks);
const TOTAL = ALL_LOCKS.length;
const memoryNo = lock => ALL_LOCKS.findIndex(l => l.id === lock.id) + 1;
const keyCount = () => ALL_LOCKS.filter(l => state.keys[l.id]).length;
const dayDone  = day => day.locks.every(l => state.keys[l.id]);

/* ── date & time gates ── */
const pad2 = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const validDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const anchorDate = () => validDate(VAULT.startDate) ? VAULT.startDate : (validDate(state.firstOpened) ? state.firstOpened : null);
function dateFor(i){ /* midnight when day i opens (i = VAULT.days.length → the finale); null = ungated */
  const day = VAULT.days[i];
  if (day && validDate(day.opensOn)) return new Date(day.opensOn + 'T00:00:00');
  const a = anchorDate();
  if (!a) return null;
  const d = new Date(a + 'T00:00:00');
  d.setDate(d.getDate() + i);
  return d;
}
function lockOpensAt(dayIdx, lock){
  const base = dateFor(dayIdx);
  if (!base) return null;
  const d = new Date(base);
  if (typeof lock.opensAt === 'string' && /^\d{1,2}:\d{2}$/.test(lock.opensAt)){
    const parts = lock.opensAt.split(':');
    d.setHours(+parts[0], +parts[1], 0, 0);
  }
  return d;
}
const dayDateOk = i => { const d = dateFor(i); return !d || new Date() >= d; };
const lockTimeOk = (dayIdx, lock) => { const d = lockOpensAt(dayIdx, lock); return !d || new Date() >= d; };
const dayAvailable = i => PREVIEW || (dayDateOk(i) && (i === 0 || dayDone(VAULT.days[i - 1])));
const lockAvailable = (dayIdx, j) => {
  const locks = VAULT.days[dayIdx].locks;
  return PREVIEW || ((j === 0 || !!state.keys[locks[j - 1].id]) && lockTimeOk(dayIdx, locks[j]));
};
const fmtTime = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
function fmtWhen(d){
  const now = new Date();
  const days = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'tomorrow';
  return 'on ' + d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}

let liveScreen = null; // map/day screens re-render themselves when a gate flips open
function gateSig(){
  let s = '';
  VAULT.days.forEach((day, i) => {
    s += dayAvailable(i) ? '1' : '0';
    day.locks.forEach((l, j) => { s += lockAvailable(i, j) ? '1' : '0'; });
  });
  return s + (dayDateOk(VAULT.days.length) ? '1' : '0');
}
setInterval(() => {
  if (!liveScreen) return;
  const sig = gateSig();
  if (sig !== liveScreen.sig){ liveScreen.sig = sig; liveScreen.fn(); }
}, 15000);

const sleep = ms => new Promise(r => setTimeout(r, ms));
const buzz = ms => { try{ if (navigator.vibrate) navigator.vibrate(ms); }catch(e){} };

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function clear(){ liveScreen = null; app.replaceChildren(); window.scrollTo(0,0); }
function snap(node){ try{ node.scrollIntoView({behavior:'smooth', block:'end'}); }catch(e){} }

function toast(msg){
  const t = el('div','toast', msg);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function hearts(n){
  const c = el('div','hearts');
  const set = ['❤️','🧡','💛','🤍','✨'];
  for (let i = 0; i < (n||16); i++){
    const h = el('span', null, set[i % set.length]);
    h.style.left = (Math.random()*100) + '%';
    h.style.animationDelay = (Math.random()*1.4) + 's';
    h.style.fontSize = (13 + Math.random()*18) + 'px';
    c.appendChild(h);
  }
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 5200);
}

/* star field */
(function(){
  const s = document.getElementById('stars');
  for (let i = 0; i < 42; i++){
    const star = el('i');
    star.style.left = (Math.random()*100) + '%';
    star.style.top = (Math.random()*100) + '%';
    star.style.animationDelay = (Math.random()*4) + 's';
    star.style.opacity = String(0.15 + Math.random()*0.5);
    s.appendChild(star);
  }
})();

/* ── chat primitives ── */
async function themSay(chat, text, ms, isSkip){
  const b = el('div','bubble them typing');
  b.append(el('i'), el('i'), el('i'));
  chat.appendChild(b); snap(b);
  const t0 = Date.now();
  while (Date.now() - t0 < ms && !(isSkip && isSkip())) await sleep(60);
  b.classList.remove('typing');
  b.replaceChildren();
  b.textContent = text;
  snap(b);
  return b;
}
function themSayNow(chat, text){
  const b = el('div','bubble them', text);
  chat.appendChild(b);
  return b;
}
function youSay(chat, text){
  const b = el('div','bubble you', text);
  chat.appendChild(b); snap(b);
  return b;
}
async function playLines(chat, lines){
  let skip = false;
  const tap = () => { skip = true; };
  chat.addEventListener('pointerdown', tap);
  const hint = el('div','hint-tap','tap anywhere to hurry me up');
  chat.appendChild(hint);
  for (const raw of lines){
    const text = fmt(raw);
    await themSay(chat, text, skip ? 120 : Math.min(500 + text.length*24, 2000), () => skip);
  }
  hint.remove();
  chat.removeEventListener('pointerdown', tap);
}

/* ── screens ── */
function renderGate(){
  clear();
  const sc = el('div','screen gate');
  const wrap = el('div','dial-wrap');
  wrap.appendChild(el('div','dial'));
  sc.appendChild(wrap);
  sc.appendChild(el('div','eyebrow','A private vault'));
  sc.appendChild(el('h1','title serif','The Vault of Us'));
  sc.appendChild(el('p','sub', fmt('{relationshipLength} of us, locked away in nine memories.\nEvery lock you open earns a key.\nNine keys open the final door.')));

  const dock = el('div','dock');
  dock.style.marginTop = '30px';

  const enter = () => {
    state.entered = true;
    if (!validDate(state.firstOpened)) state.firstOpened = todayStr(); // anchors Day 1 in auto mode
    save();
    sc.classList.add('opening');
    buzz(30);
    setTimeout(renderMap, 1600);
  };

  if (VAULT.herName){
    const row = el('div','dock-row');
    const inp = el('input','inp');
    inp.placeholder = 'This vault opens for one person. Who are you?';
    const btn = el('button','btn small','Enter');
    const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,'');
    const first = norm(VAULT.herName.split(' ')[0]);
    const attempt = () => {
      const v = norm(inp.value);
      if (v && (v.includes(first) || first.includes(v)) && v.length >= 2){
        toast('There you are. 💛');
        enter();
      } else {
        inp.value = '';
        inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
        inp.placeholder = 'Hmm. This vault knows its owner. 🙂';
      }
    };
    btn.addEventListener('click', attempt);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
    row.append(inp, btn);
    dock.appendChild(row);
  } else {
    const btn = el('button','btn','Open the vault');
    btn.addEventListener('click', enter);
    dock.appendChild(btn);
  }
  sc.appendChild(dock);
  app.appendChild(sc);
}

function renderMap(){
  clear();
  liveScreen = { fn: renderMap, sig: gateSig() };
  const sc = el('div','screen');
  sc.appendChild(el('div','eyebrow','The Vault of Us'));
  const h = el('h1','title serif', VAULT.herName ? ('For ' + VAULT.herName) : 'Four days. Nine keys.');
  h.style.fontSize = '32px';
  sc.appendChild(h);
  const kc = el('div','keycount');
  kc.textContent = '🔑 ' + keyCount() + ' of ' + TOTAL + ' keys collected';
  sc.appendChild(kc);

  const days = el('div','days');

  VAULT.days.forEach((day, i) => {
    const avail = dayAvailable(i);
    const done = dayDone(day);
    const card = el('button','day-card' + (avail ? '' : ' locked'));
    card.appendChild(el('div','glyph', done ? '✓' : (avail ? day.glyph : '🔒')));
    const body = el('div');
    body.appendChild(el('div','d-eyebrow','Day ' + (i+1)));
    body.appendChild(el('h3', null, day.title));
    let sub = day.tagline;
    if (!avail){
      sub = !dayDateOk(i)
        ? ('This door opens ' + fmtWhen(dateFor(i)) + '.')
        : ('Finish Day ' + i + ' to open this door.');
    }
    body.appendChild(el('p', null, fmt(sub)));
    const dots = el('div','dots');
    day.locks.forEach(l => {
      const d = el('i');
      if (state.keys[l.id]) d.classList.add('on');
      dots.appendChild(d);
    });
    body.appendChild(dots);
    card.appendChild(body);
    if (avail) card.addEventListener('click', () => renderDay(i));
    days.appendChild(card);
  });

  const allDays = VAULT.days.every(dayDone);
  const finOpen = PREVIEW || (allDays && dayDateOk(VAULT.days.length));
  const fin = el('button','day-card' + (finOpen ? '' : ' locked'));
  fin.appendChild(el('div','glyph', finOpen ? VAULT.finale.glyph : '🔒'));
  const fb = el('div');
  fb.appendChild(el('div','d-eyebrow','Day ' + (VAULT.days.length + 1)));
  fb.appendChild(el('h3', null, VAULT.finale.title));
  let finSub;
  if (finOpen) finSub = fmt(VAULT.finale.tagline);
  else if (!allDays) finSub = 'The final door needs all ' + TOTAL + ' keys. ' + (TOTAL - keyCount()) + ' to go.';
  else finSub = 'The final door opens ' + fmtWhen(dateFor(VAULT.days.length)) + '.';
  fb.appendChild(el('p', null, finSub));
  fin.appendChild(fb);
  if (finOpen) fin.addEventListener('click', renderFinale);
  days.appendChild(fin);

  sc.appendChild(days);
  sc.appendChild(el('div','foot', fmt('built for you, key by key — {yourName} ♥')));
  app.appendChild(sc);
}

function renderDay(i){
  clear();
  liveScreen = { fn: () => renderDay(i), sig: gateSig() };
  const day = VAULT.days[i];
  const sc = el('div','screen');

  const bar = el('div','topbar');
  const back = el('button','back','‹');
  back.addEventListener('click', renderMap);
  const crumb = el('div','crumb');
  crumb.textContent = 'Day ' + (i+1);
  const b = el('b', null, day.title);
  crumb.appendChild(b);
  bar.append(back, crumb);
  sc.appendChild(bar);

  sc.appendChild(el('p','epigraph', fmt(day.epigraph)));

  const list = el('div','locks');
  day.locks.forEach((lock, j) => {
    const done = !!state.keys[lock.id];
    const avail = done || lockAvailable(i, j);
    const row = el('button','lock-row' + (done ? ' done' : (avail ? '' : ' locked')));
    row.appendChild(el('div','num', String(memoryNo(lock))));
    const body = el('div');
    body.appendChild(el('h4', null, lock.title));
    let desc;
    if (done) desc = 'Unlocked — tap to reread the memory.';
    else if (avail) desc = fmt(lock.teaser);
    else if (!(j === 0 || state.keys[day.locks[j-1].id])) desc = 'Open the lock above first.';
    else { const t = lockOpensAt(i, lock); desc = 'Sealed until ' + fmtTime(t) + ' ' + fmtWhen(t) + '.'; }
    body.appendChild(el('p', null, desc));
    row.appendChild(body);
    row.appendChild(el('div','state', done ? '🔑' : '🔒'));
    if (done) row.addEventListener('click', () => renderReveal(i, lock, true));
    else if (avail) row.addEventListener('click', () => renderLock(i, lock));
    list.appendChild(row);
  });
  sc.appendChild(list);
  app.appendChild(sc);
}

function renderLock(dayIdx, lock){
  clear();
  const day = VAULT.days[dayIdx];
  const sc = el('div','screen');

  const bar = el('div','topbar');
  const back = el('button','back','‹');
  back.addEventListener('click', () => renderDay(dayIdx));
  const crumb = el('div','crumb');
  crumb.textContent = 'Lock ' + memoryNo(lock) + ' of ' + TOTAL;
  crumb.appendChild(el('b', null, lock.title));
  bar.append(back, crumb);
  sc.appendChild(bar);

  const chat = el('div','chat');
  const dock = el('div','dock');
  sc.append(chat, dock);
  app.appendChild(sc);

  const unlockNow = async (preLine) => {
    dock.replaceChildren();
    if (preLine) await themSay(chat, preLine, 900);
    const btn = el('button','btn','🔑  Open Memory ' + memoryNo(lock));
    btn.addEventListener('click', () => {
      if (!state.keys[lock.id]){ state.keys[lock.id] = true; save(); buzz([20,40,20]); }
      renderReveal(dayIdx, lock, false);
    });
    dock.appendChild(btn);
    snap(btn);
  };

  playLines(chat, lock.lines).then(() => {
    if (lock.type === 'guesses')      guessDock(chat, dock, lock, unlockNow);
    else if (lock.type === 'story')   storyDock(chat, dock, lock, unlockNow);
    else if (lock.type === 'passphrase') passDock(chat, dock, lock, unlockNow);
    else if (lock.type === 'ceremony')   sealDock(chat, dock, lock, unlockNow);
    else unlockNow();
  });
}

function guessDock(chat, dock, lock, unlockNow){
  const guesses = state.answers[lock.id] = state.answers[lock.id] || [];
  const max = lock.maxGuesses || 3;
  const resp = i => fmt(lock.guessResponses[Math.min(i, lock.guessResponses.length - 1)]);

  // replay any guesses she already made in a previous visit
  guesses.forEach((g, i) => { youSay(chat, g); themSayNow(chat, resp(i)); });
  if (guesses.length >= max) return unlockNow();

  const row = el('div','dock-row');
  const inp = el('input','inp');
  inp.placeholder = fmt(lock.placeholder || 'Type your guess…');
  const btn = el('button','btn small','Guess');
  row.append(inp, btn);
  const giveUp = el('button','linkish','just tell me 🥺');
  giveUp.style.display = guesses.length ? '' : 'none';
  giveUp.addEventListener('click', () => unlockNow('Okay, okay. Come here. 🙂'));
  dock.append(row, giveUp);

  const send = async () => {
    const v = inp.value.trim();
    if (!v) return;
    inp.value = '';
    inp.disabled = btn.disabled = true;
    youSay(chat, v);
    guesses.push(v); save();
    await themSay(chat, resp(guesses.length - 1), 1100);
    if (guesses.length >= max){
      unlockNow();
    } else {
      inp.disabled = btn.disabled = false;
      giveUp.style.display = '';
      inp.focus();
    }
  };
  btn.addEventListener('click', send);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
}

function storyDock(chat, dock, lock, unlockNow){
  const saved = state.answers[lock.id];
  if (saved && saved.length){
    youSay(chat, saved[saved.length - 1]);
    return unlockNow('Thank you for that. Now — my side of it.');
  }
  const ta = el('textarea','ta');
  ta.placeholder = fmt(lock.placeholder || 'Tell me…');
  const btn = el('button','btn','Tell me →');
  let nudged = false;
  btn.addEventListener('click', async () => {
    const v = ta.value.trim();
    if (!v) return;
    if (v.length < (lock.minLength || 30) && !nudged){
      nudged = true;
      themSayNow(chat, fmt(lock.nudge || 'Take your time. I want the whole scene. 🙂'));
      snap(dock);
      return;
    }
    state.answers[lock.id] = [v]; save();
    ta.remove(); btn.remove();
    youSay(chat, v);
    unlockNow('Thank you for that. Now — my side of it.');
  });
  dock.append(ta, btn);
}

function passDock(chat, dock, lock, unlockNow){
  const tries = state.answers[lock.id] = state.answers[lock.id] || [];
  const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
  const accepted = (lock.accept || []).filter(a => !String(a).includes('✏️')).map(norm).filter(Boolean);
  const wrongs = lock.wrongResponses || ['Nope. 🙂','Still no.','Hint incoming…'];

  const row = el('div','dock-row');
  const inp = el('input','inp');
  inp.placeholder = fmt(lock.placeholder || 'Type the answer…');
  const btn = el('button','btn small','Try');
  row.append(inp, btn);
  dock.appendChild(row);

  let mercy = null;
  const send = async () => {
    const v = inp.value.trim();
    if (!v) return;
    inp.value = '';
    const nv = norm(v);
    youSay(chat, v);
    const ok = accepted.length === 0 /* placeholders not filled in yet — accept anything */
      || accepted.some(a => nv === a || (nv.length >= 3 && (nv.includes(a) || a.includes(nv))));
    if (ok){
      inp.disabled = btn.disabled = true;
      buzz(30);
      return unlockNow();
    }
    tries.push(v); save();
    inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
    await themSay(chat, fmt(wrongs[Math.min(tries.length - 1, wrongs.length - 1)]), 800);
    if (tries.length === 3 && lock.hint) await themSay(chat, fmt(lock.hint), 1000);
    if (tries.length >= 6 && !mercy){
      mercy = el('button','linkish',"okay come here — I'll open it myself");
      mercy.addEventListener('click', () => unlockNow());
      dock.appendChild(mercy);
    }
    snap(dock);
  };
  btn.addEventListener('click', send);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
}

function sealDock(chat, dock, lock, unlockNow){
  const zone = el('div','seal-zone');
  const seal = el('button','seal');
  seal.appendChild(el('span', null, '♥'));
  const label = el('div','seal-label','press & hold');
  zone.append(seal, label);
  dock.appendChild(zone);
  snap(zone);

  const holdMs = (lock.holdSeconds || 3) * 1000;
  let p = 0, timer = null, warned = false, done = false;

  const start = e => {
    if (done) return;
    e.preventDefault();
    clearInterval(timer);
    timer = setInterval(() => {
      p += 100 / (holdMs / 50);
      seal.style.setProperty('--p', Math.min(p,100) + '%');
      if (p >= 100){
        clearInterval(timer);
        done = true;
        buzz([30,60,30]);
        zone.remove();
        unlockNow();
      }
    }, 50);
  };
  const stop = () => {
    if (done) return;
    clearInterval(timer);
    if (p > 12 && !warned){
      warned = true;
      themSayNow(chat, fmt(lock.holdWarning || "Don't let go. 🙂"));
      snap(dock);
    }
    p = 0;
    seal.style.setProperty('--p','0%');
  };
  seal.addEventListener('pointerdown', start);
  seal.addEventListener('pointerup', stop);
  seal.addEventListener('pointercancel', stop);
  seal.addEventListener('pointerleave', stop);
}

function renderReveal(dayIdx, lock, replay){
  clear();
  const n = memoryNo(lock);
  const sc = el('div','screen memory');
  const card = el('div','memory-card');
  card.appendChild(el('div','m-eyebrow','Memory № ' + n + ' — unlocked'));
  card.appendChild(el('h2', null, fmt(lock.reveal.title || lock.title)));
  card.appendChild(el('div','m-rule'));

  let delay = 0.25;
  lock.reveal.lines.forEach(line => {
    const p = el('p','mline', fmt(line));
    p.style.animationDelay = delay + 's';
    delay += replay ? 0.15 : 0.55;
    card.appendChild(p);
  });

  const kt = el('div','key-toast','🔑  Key ' + keyCount() + ' of ' + TOTAL);
  kt.style.animationDelay = delay + 's';
  card.appendChild(kt);
  sc.appendChild(card);

  const after = el('div','after-card');
  after.style.animationDelay = (delay + 0.3) + 's';
  if (!replay && keyCount() >= TOTAL){
    const fin = el('button','btn','The final door is ready →');
    fin.addEventListener('click', renderFinale);
    after.appendChild(fin);
  }
  const backBtn = el('button','btn ghost','Back to the vault');
  backBtn.addEventListener('click', () => renderDay(dayIdx));
  after.appendChild(backBtn);
  sc.appendChild(after);

  app.appendChild(sc);
  if (!replay) hearts(12);
}

function renderFinale(){
  clear();
  if (keyCount() < TOTAL || !(PREVIEW || dayDateOk(VAULT.days.length))) return renderMap();
  const sc = el('div','screen gate');

  const wrap = el('div','dial-wrap');
  wrap.appendChild(el('div','dial'));
  sc.appendChild(wrap);
  sc.appendChild(el('div','eyebrow','Day ' + (VAULT.days.length + 1) + ' — ' + VAULT.finale.title));
  sc.appendChild(el('h1','title serif','Every key is in your hand.'));

  const holes = el('div','keyholes');
  for (let i = 0; i < TOTAL; i++){
    const h = el('i');
    setTimeout(() => h.classList.add('on'), 250 + i * 160);
    holes.appendChild(h);
  }
  sc.appendChild(holes);

  const dock = el('div','dock');
  const btn = el('button','btn','Turn the wheel');
  btn.addEventListener('click', () => {
    btn.disabled = true;
    sc.classList.add('opening');
    buzz([40,80,40]);
    setTimeout(renderInvitation, 2000);
  });
  dock.appendChild(btn);
  sc.appendChild(dock);
  app.appendChild(sc);
}

function renderInvitation(){
  clear();
  const sc = el('div','screen memory');
  const card = el('div','memory-card');
  card.appendChild(el('div','m-eyebrow','The vault is open'));
  card.appendChild(el('h2', null, 'One more memory to make.'));
  card.appendChild(el('div','m-rule'));

  let delay = 0.3;
  VAULT.finale.letter.forEach(line => {
    const p = el('p','mline', fmt(line));
    p.style.animationDelay = delay + 's';
    delay += 0.7;
    card.appendChild(p);
  });

  const invite = el('div','invite');
  invite.style.opacity = '0';
  invite.style.animation = 'mIn .8s ease ' + delay + 's forwards';
  [['When', VAULT.finale.when], ['Time', VAULT.finale.time], ['Where', VAULT.finale.where], ['Note', VAULT.finale.note]].forEach(([k, v]) => {
    if (!v) return;
    const row = el('div','row');
    row.appendChild(el('div','k', k));
    row.appendChild(el('div','v', fmt(v)));
    invite.appendChild(row);
  });
  card.appendChild(invite);

  const sign = el('p','mline serif', fmt(VAULT.finale.sign));
  sign.style.animationDelay = (delay + 0.6) + 's';
  sign.style.textAlign = 'center';
  sign.style.marginTop = '20px';
  card.appendChild(sign);
  sc.appendChild(card);

  const after = el('div','after-card');
  after.style.animationDelay = (delay + 1) + 's';
  const share = el('button','btn', fmt('💌  Send {yourName} your answers'));
  share.addEventListener('click', shareAnswers);
  const again = el('button','linkish','wander back through the memories');
  again.addEventListener('click', renderMap);
  after.append(share, again);
  sc.appendChild(after);

  app.appendChild(sc);
  hearts(26);
  setTimeout(() => hearts(20), 1200);
}

function buildAnswersText(){
  const out = [fmt('My keys to the Vault of Us 💛'), ''];
  VAULT.days.forEach(day => {
    day.locks.forEach(lock => {
      const ans = state.answers[lock.id];
      if (!ans || !ans.length) return;
      out.push('🔐 ' + lock.title);
      ans.forEach(a => out.push('   ' + a));
      out.push('');
    });
  });
  return out.join('\n');
}
async function shareAnswers(){
  const text = buildAnswersText();
  try{
    if (navigator.share){ await navigator.share({ text }); return; }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  try{
    await navigator.clipboard.writeText(text);
    toast('Copied — now paste it to ' + (VAULT.yourName || 'him') + ' 💌');
  }catch(e){
    toast('Could not copy automatically — screenshot works too 🙂');
  }
}

/* ── boot ── */
if (state.entered) renderMap();
else renderGate();

})();
</script>
</body>
</html>
