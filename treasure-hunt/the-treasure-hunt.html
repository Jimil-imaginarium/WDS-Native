<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Treasure Hunt ❤️</title>
<style>
/* ═══════════════════════════════════════════════════════════
   The Treasure Hunt ❤️ — single-file romantic treasure hunt
   with a password-locked Admin control panel + Player role.
   ═══════════════════════════════════════════════════════════ */
:root{
  --ink:#140a22;--ink-2:#1e1236;
  --panel:rgba(255,255,255,.045);--panel-line:rgba(255,255,255,.10);
  --rose:#f472b6;--rose-deep:#db2777;
  --gold:#fbbf24;--gold-soft:#fde68a;--paper:#f7ecd8;
  --text:#f4e9f3;--mist:#b7a6cc;
  --good:#34d399;--bad:#fb7185;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);color:var(--text);background:var(--ink);
  min-height:100dvh;overflow-x:hidden;line-height:1.6;
  background-image:
    radial-gradient(120% 80% at 50% -10%, #3a1d5e 0%, transparent 55%),
    radial-gradient(90% 60% at 85% 115%, rgba(219,39,119,.30) 0%, transparent 60%),
    linear-gradient(180deg,#160b28 0%,#0f0720 100%);
  background-attachment:fixed;
}
::selection{background:rgba(244,114,182,.35)}

#sky,#hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;opacity:.5;animation:tw var(--d,3s) ease-in-out infinite}
.star.gold{background:var(--gold-soft);box-shadow:0 0 6px var(--gold-soft)}
@keyframes tw{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.95;transform:scale(1.5)}}
.heart{position:absolute;bottom:-40px;color:var(--rose);opacity:.25;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:var(--o,.25)}90%{opacity:var(--o,.25)}100%{transform:translateY(-112vh) rotate(var(--rot,15deg));opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}

.wrap{position:relative;z-index:10;max-width:760px;margin:0 auto;padding:22px 20px 90px}
.wrap.wide{max-width:900px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;min-height:44px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:1.15rem}
.brand .g{background:linear-gradient(100deg,#f9a8d4,#f472b6,#fbcfe8,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.topbtns{display:flex;gap:8px;align-items:center}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--panel-line);background:var(--panel);
  color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:1.05rem;backdrop-filter:blur(8px);transition:transform .15s,background .2s}
.iconbtn:hover{background:rgba(255,255,255,.09)}
.iconbtn:active{transform:scale(.94)}
.iconbtn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.rolechip{font-size:.7rem;letter-spacing:.08em;padding:5px 11px;border-radius:999px;border:1px solid var(--panel-line);background:var(--panel);color:var(--mist)}
.rolechip.admin{color:var(--gold-soft);border-color:rgba(251,191,36,.3)}

.glass{background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--r);backdrop-filter:blur(12px);box-shadow:0 24px 60px -30px rgba(0,0,0,.8)}
.eyebrow{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--mist)}
.display{font-family:var(--serif);line-height:1.08;text-wrap:balance;font-weight:600}
.romantic{background:linear-gradient(100deg,#f9a8d4 10%,#f472b6 40%,#fde6f2 52%,#f472b6 64%,#f9a8d4 90%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
.treasure{background:linear-gradient(100deg,var(--gold-soft) 20%,var(--gold) 42%,#fff7db 52%,var(--gold) 62%,var(--gold-soft) 82%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:200% center}}
.muted{color:var(--mist)}
.serif-body{font-family:var(--serif);font-style:italic;color:#efe2ee}

.btn{appearance:none;border:0;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:1rem;padding:14px 26px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .15s,box-shadow .25s,filter .2s;color:#fff;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-rose{background:linear-gradient(100deg,var(--rose-deep),var(--rose));box-shadow:0 12px 30px -10px rgba(244,114,182,.7)}
.btn-rose:hover{box-shadow:0 16px 40px -10px rgba(244,114,182,.9)}
.btn-gold{background:linear-gradient(100deg,var(--gold),var(--gold-soft));color:#5a3d05;box-shadow:0 12px 30px -10px rgba(251,191,36,.7)}
.btn-gold:hover{filter:brightness(1.05)}
.btn-ghost{background:var(--panel);border:1px solid var(--panel-line);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.btn-sm{padding:9px 16px;font-size:.85rem}
.btn-lg{padding:17px 40px;font-size:1.08rem}
.btn-danger{background:rgba(251,113,133,.16);border:1px solid rgba(251,113,133,.4);color:#fecdd3}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.field,.ta{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--panel-line);background:rgba(0,0,0,.28);color:var(--text);font-size:1rem;font-family:var(--sans)}
.field.serif{font-family:var(--serif);font-size:1.05rem}
.field::placeholder,.ta::placeholder{color:#8f7fa6}
.ta{font-family:var(--sans);line-height:1.6;resize:vertical;min-height:70px}
label.lbl{display:block;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mist);margin:0 0 6px 2px}

.screen{animation:fade .55s ease both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* login */
.login{min-height:82dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.login .panel{width:100%;max-width:400px;padding:30px 26px}
.bigheart{font-size:3.2rem;animation:beat 1.5s ease-in-out infinite;filter:drop-shadow(0 6px 20px rgba(244,114,182,.6))}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
.divider{display:flex;align-items:center;gap:12px;color:var(--mist);font-size:.75rem;letter-spacing:.1em;margin:6px 0}
.divider::before,.divider::after{content:"";height:1px;flex:1;background:var(--panel-line)}
.linkbtn{background:none;border:0;color:var(--mist);cursor:pointer;font-size:.85rem;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--text)}

/* welcome hero on player map handled inline */
.progresswrap{margin:6px 0 26px}
.pbar{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.pfill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--rose-deep),var(--rose),var(--gold));box-shadow:0 0 14px rgba(244,114,182,.6);transition:width .8s cubic-bezier(.22,1,.36,1)}
.map{display:flex;flex-direction:column;gap:26px;position:relative}
.island{position:relative;overflow:hidden;padding:22px 20px}
.island h3{font-size:1.55rem;margin-top:2px}
.island .isle-story{font-size:.9rem;margin-top:6px}
.chests{display:flex;justify-content:space-around;align-items:flex-end;gap:10px;margin-top:20px}
.chest{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px;border-radius:14px;transition:transform .15s}
.chest:hover:not([disabled]){transform:translateY(-4px)}
.chest[disabled]{cursor:not-allowed}
.chest .cap{font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.cap.locked{background:rgba(255,255,255,.06);color:#9686ab}
.cap.open{background:rgba(244,114,182,.18);color:#fbcfe8}
.cap.done{background:rgba(251,191,36,.18);color:var(--gold-soft)}
.palm{position:absolute;right:-10px;top:-14px;width:140px;height:140px;opacity:.16;pointer-events:none}
.island.done{border-color:rgba(251,191,36,.4);box-shadow:0 0 44px -18px rgba(251,191,36,.5)}
.island.active{border-color:rgba(244,114,182,.35)}

.card{padding:26px 22px}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:20px}
.chest-stage{display:flex;justify-content:center;margin:6px 0}
.qbox{background:rgba(0,0,0,.22);border:1px solid var(--panel-line);border-radius:14px;padding:18px}
.answer-row{display:flex;gap:10px;flex-wrap:wrap}
.answer-row .field{flex:1;min-width:180px}
.note{border-radius:14px;padding:16px 18px;text-align:center}
.note.wait{background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.3);color:var(--gold-soft)}
.note.good{background:rgba(52,211,153,.10);border:1px solid rgba(52,211,153,.3);color:#a7f3d0}
.note.bad{background:rgba(251,113,133,.10);border:1px solid rgba(251,113,133,.32);color:#fecdd3}
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--mist);text-decoration:none;font-size:.9rem;margin-bottom:16px;background:none;border:0;cursor:pointer}
.backlink:hover{color:var(--text)}

.countdown{display:flex;flex-direction:column;align-items:center;gap:12px}
.cd-digits{display:flex;align-items:flex-start;gap:8px}
.cd-cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.cd-num{font-family:var(--serif);font-weight:700;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.35);border:1px solid rgba(251,191,36,.22);border-radius:12px;color:var(--gold-soft);min-width:58px;text-align:center;padding:10px 6px;font-size:2rem;line-height:1}
.cd-lab{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mist)}
.cd-colon{font-family:var(--serif);font-size:1.6rem;color:rgba(251,191,36,.5);padding-top:12px}

.finale{min-height:70dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px}
.letter{white-space:pre-wrap;font-family:var(--serif);font-size:1.12rem;line-height:1.9;color:#3a2a17;background:linear-gradient(170deg,#f7ecd8,#efdcbf);border-radius:16px;padding:34px 30px;text-align:left;box-shadow:0 30px 70px -30px rgba(0,0,0,.8);position:relative}
.letter::before{content:"💌";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:1.8rem}
.treasure-img{max-width:100%;max-height:340px;border-radius:16px;border:1px solid rgba(251,191,36,.3);box-shadow:0 0 60px -20px rgba(251,191,36,.5)}

/* ── admin dashboard ── */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:6px}
.tab{flex:1;min-width:96px;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--mist);cursor:pointer;font-size:.9rem;font-weight:600;transition:background .2s,color .2s}
.tab.active{background:rgba(255,255,255,.08);color:var(--text)}
.tab:hover:not(.active){color:var(--text)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px}
.stat{padding:16px}
.stat .k{font-size:.72rem;color:var(--mist)}
.stat .v{font-family:var(--serif);font-size:1.7rem;margin-top:4px}
.admin-day{padding:20px;margin-bottom:16px}
.admin-day .dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.admin-riddle{border:1px solid var(--panel-line);border-radius:14px;padding:16px;margin-bottom:12px;background:rgba(0,0,0,.18)}
.admin-riddle .rh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.fieldrow{margin-bottom:14px}
.chk{display:flex;align-items:center;gap:8px;color:var(--mist);font-size:.88rem;cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--rose)}
.hint{font-size:.76rem;color:var(--mist);margin-top:6px}
.savedtag{font-size:.72rem;color:var(--good);opacity:0;transition:opacity .3s}
.savedtag.show{opacity:1}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border:1px solid var(--panel-line);border-radius:12px;margin-bottom:8px;background:rgba(0,0,0,.18)}
.badge{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:999px}
.badge.done{background:rgba(52,211,153,.18);color:#a7f3d0}
.badge.todo{background:rgba(255,255,255,.06);color:var(--mist)}
.warn{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);color:var(--gold-soft);border-radius:12px;padding:12px 14px;font-size:.85rem}

@media (max-width:520px){
  .cd-num{min-width:46px;font-size:1.5rem;padding:8px 4px}
  .island h3{font-size:1.35rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important}
  .romantic,.treasure{animation:none}
}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div id="hearts" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap" id="root"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   ❤️  DEFAULT CONFIG — the starting content.
   You normally won't edit this by hand: log in as Admin (see
   adminPassword below) and change everything from the control panel.
   ═══════════════════════════════════════════════════════════════════ */
const DEFAULT_CONFIG = {
  playerName: "My Love",
  startDate: "2026-07-14",
  slotTimes: ["10:00", "14:00", "21:00"],
  unlockAll: false,
  adminPassword: "keeper",   /* ← the Admin password. CHANGE THIS. */
  playerPassword: "",        /* ← optional password for her; "" = none */

  finale: {
    treasureTitle: "The Final Treasure",
    treasureMessage: "You found it. The treasure was never gold — it was every moment that led you here. Come find me for your real prize. ❤️",
    treasureImage: "",
    loveLetter:
`My love,

If you are reading this, you solved every riddle — of course you did. You know our story better than anyone, because you wrote it with me.

Every island on that map was a piece of us. Every chest you opened was a memory I never want to lose. And this letter is a promise: the map keeps growing, and I intend to fill every corner of it with you.

Forever yours. ❤️`
  },

  days: [
    { title:"Where It All Began", island:"Isle of First Glances",
      story:"We sail back to the moments that started everything — the first looks, the first laughs, the first butterflies.",
      riddles:[
        { title:"The First Hello", story:"Close your eyes and drift back… a nervous heartbeat, a first hello. Somewhere in our story two strangers stopped being strangers.",
          question:"Where did we meet for the very first time?", answers:["EDIT ME"],
          punishment:{title:"The Dramatic Retelling", description:"Record a 30-second dramatic re-enactment of the moment we first met. Bonus points for fake tears and slow motion."} },
        { title:"The Song of Us", story:"Every love story has a soundtrack. Ours has one song that turns the world's volume down and ours up.",
          question:"What song do we both call ‘our song’?", answers:["EDIT ME"],
          punishment:{title:"Sing It Loud", description:"Sing the chorus of my favorite song — full feeling, full volume. No whispering allowed!"} },
        { title:"First Date Detective", story:"A table for two, nervous smiles, and someone talking way too fast. That evening is a treasure in itself.",
          question:"What did we eat on our first date?", answers:["EDIT ME"],
          punishment:{title:"Chef's Apology", description:"Take a funny selfie holding whatever snack is nearest to you, captioned ‘I should have remembered the menu.’"} }
      ] },
    { title:"Little Things, Big Love", island:"Cove of Tiny Details",
      story:"Love hides in the little things — the habits, the inside jokes, the details only we would notice.",
      riddles:[
        { title:"The Guardian of My Sleep", story:"There is something of mine you always steal, and honestly… it looks better on you anyway.",
          question:"Which piece of my clothing do you steal the most?", answers:["EDIT ME"],
          punishment:{title:"The Hoodie Tax", description:"Wear my hoodie, strike your most dramatic model pose, and take a photo. Work it."} },
        { title:"Nickname Chronicles", story:"Real names are for strangers and paperwork. We have our own language, and it started with one silly name.",
          question:"What was the very first nickname I called you?", answers:["EDIT ME"],
          punishment:{title:"Twenty Times the Love", description:"Say ‘I love you’ 20 times, each in a different style — whisper, opera, robot, villain… get creative."} },
        { title:"The Coffee Code", story:"I could order for you blindfolded. Could you order for me? Let's find out, barista.",
          question:"What is my usual order at our favorite café?", answers:["EDIT ME"],
          punishment:{title:"Barista Dance", description:"Dance for 30 seconds like nobody is watching (I will be watching)."} }
      ] },
    { title:"Adventures & Memories", island:"Bay of Golden Days",
      story:"We have collected days like seashells — bright ones, silly ones, unforgettable ones. Today we open the shell box.",
      riddles:[
        { title:"The Great Escape", story:"Bags packed, playlists ready, the world waiting. One trip together beats a hundred alone.",
          question:"Where did we go on our first trip together?", answers:["EDIT ME"],
          punishment:{title:"Travel Vlogger", description:"Film a 30-second ‘travel vlog’ about the room you're in, narrated like it's the most exotic place on Earth."} },
        { title:"Laughing Fit", story:"There is one memory that makes us laugh every single time, no matter how often we tell it.",
          question:"Describe the story behind our biggest laughing fit ever.", answers:null,
          punishment:{title:"Comedy Special", description:"Tell your best joke out loud. If it doesn't make me laugh, the punishment repeats. High stakes!"} },
        { title:"The Photo That Says It All", story:"Thousands of photos, but one of them is simply… us. The one we both come back to.",
          question:"Describe my absolute favorite photo of us (when & where it was taken).", answers:null,
          punishment:{title:"Recreate the Masterpiece", description:"Recreate any photo of us as closely as you can, by yourself, using props."} }
      ] },
    { title:"The Heart of the Map", island:"Isle of Forever",
      story:"The final island. The compass no longer points north — it points to us. Three riddles stand between you and the treasure.",
      riddles:[
        { title:"Dreams We Share", story:"Somewhere between ‘someday’ and ‘promise’, we built a dream we keep coming back to.",
          question:"What is the one dream we always talk about doing together?", answers:null,
          punishment:{title:"Architect of Dreams", description:"Draw our dream (stick figures welcome) and keep it to show me."} },
        { title:"The Exact Moment", story:"Love doesn't arrive with fireworks. It sneaks in quietly — and then one day you just know.",
          question:"When did I first say ‘I love you’? (Where were we, what was happening?)", answers:null,
          punishment:{title:"The Love Monologue", description:"Perform a 30-second dramatic monologue about how amazing I am. Shakespeare-level drama required."} },
        { title:"X Marks the Heart", story:"The last riddle. Past every island, every chest, every clue — there was only ever one treasure on this map.",
          question:"What is the treasure at the end of this hunt? (Hint: look in a mirror…)", answers:["you","me","us","yourself","my love","your heart","love"],
          punishment:{title:"The Victory Lap", description:"So close and still teasing me?! Slow-dance with a pillow for 30 seconds."} }
      ] }
  ]
};

/* ═══════════════════════════════════════════════════════════════════
   Engine — no need to edit below this line.
   ═══════════════════════════════════════════════════════════════════ */
(function(){
  "use strict";
  // Capture a pristine copy of the page BEFORE we mutate the DOM, so
  // the Admin "download her copy" export ships a clean, working file.
  const PRISTINE_HTML = "<!doctype html>\n" + document.documentElement.outerHTML;

  const $ = (s,el=document)=>el.querySelector(s);
  const root = document.getElementById("root");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const STORE_KEY = "treasure-hunt-state-v2";
  const CONFIG_KEY = "treasure-hunt-config-v2";

  // Baked config (from an exported "her copy") takes precedence over defaults.
  const BASE = (typeof window !== "undefined" && window.__BAKED_CONFIG__) || DEFAULT_CONFIG;

  const clone = o => JSON.parse(JSON.stringify(o));
  const rid = (d,r)=>`${d}-${r}`;

  // ── persistent state (role + progress) ──
  let state = loadState();
  function loadState(){ try{ return Object.assign(freshState(), JSON.parse(localStorage.getItem(STORE_KEY))||{}); }catch{ return freshState(); } }
  function freshState(){ return { role:null, solved:{}, punish:{}, music:false }; }
  function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

  // ── editable config ──
  let config = loadConfig();
  function loadConfig(){ try{ const o=JSON.parse(localStorage.getItem(CONFIG_KEY)); return o?migrate(o):clone(BASE); }catch{ return clone(BASE); } }
  function migrate(o){ // fill any missing fields from BASE defaults
    o.slotTimes = o.slotTimes || clone(BASE.slotTimes);
    o.finale = Object.assign(clone(BASE.finale), o.finale||{});
    if(!Array.isArray(o.days)) o.days = clone(BASE.days);
    if(typeof o.adminPassword!=="string") o.adminPassword = BASE.adminPassword;
    if(typeof o.playerPassword!=="string") o.playerPassword = BASE.playerPassword||"";
    return o;
  }
  function saveConfig(){ localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }
  function resetConfig(){ localStorage.removeItem(CONFIG_KEY); config = clone(BASE); }

  // path helpers for admin form binding
  function setPath(obj,path,val){ const p=path.split("."); let o=obj; for(let i=0;i<p.length-1;i++){ o=o[p[i]]; } o[p[p.length-1]]=val; }

  // ── unlock schedule ──
  function unlockAt(dayIdx, riddleIdx){
    const times = config.slotTimes||["10:00","14:00","21:00"];
    const [h,m] = (times[riddleIdx]||"10:00").split(":").map(Number);
    const base = new Date((config.startDate||"2026-01-01") + "T00:00:00");
    const d = new Date(base.getTime()); d.setDate(d.getDate()+dayIdx); d.setHours(h,m,0,0);
    return d;
  }
  function isUnlocked(d,r){ return config.unlockAll ? true : Date.now() >= unlockAt(d,r).getTime(); }

  // ── answer checking ──
  function norm(s){ return (s||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim(); }
  function checks(input, answers){
    if(answers===null || (Array.isArray(answers)&&answers.length===0)) return input.trim().length>0;
    const n=norm(input); if(!n) return false;
    return answers.some(a=>{ const na=norm(a); return na && (n===na||n.includes(na)||na.includes(n)); });
  }

  function riddleState(d,r){
    const id=rid(d,r);
    if(state.solved[id]) return "done";
    if(!isUnlocked(d,r)) return "locked";
    if(state.punish[id]) return "punish";
    return "open";
  }
  function totals(){ let t=0,dn=0; config.days.forEach((day,di)=>day.riddles.forEach((_,ri)=>{t++; if(state.solved[rid(di,ri)])dn++;})); return {total:t,done:dn}; }
  function firstUnsolved(){ for(let di=0;di<config.days.length;di++)for(let ri=0;ri<config.days[di].riddles.length;ri++)if(!state.solved[rid(di,ri)])return{di,ri}; return null; }
  function nextLockedUnlock(){ let s=null; config.days.forEach((day,di)=>day.riddles.forEach((_,ri)=>{ if(state.solved[rid(di,ri)])return; if(!isUnlocked(di,ri)){const t=unlockAt(di,ri).getTime(); if(s===null||t<s)s=t;} })); return s; }

  /* ── treasure chest SVG ── */
  function chestSVG(variant, open, size){
    const golden=variant==="done", locked=variant==="locked";
    const isOpen = open || golden;
    const wood=golden?"#b45309":locked?"#4b3826":"#8a5a2b";
    const woodD=golden?"#92400e":locked?"#38291b":"#6b4423";
    const trim=golden?"#fbbf24":locked?"#6b7280":"#d4a34f";
    const glow=golden?"radial-gradient(circle,rgba(251,191,36,.55),transparent 70%)":locked?"none":"radial-gradient(circle,rgba(244,114,182,.45),transparent 70%)";
    const bob=locked?"":golden?"":"";
    return `<div style="width:${size}px;height:${size}px;position:relative;display:inline-block" class="${locked?'':'floaty'}">
      <div style="position:absolute;inset:-8%;border-radius:50%;filter:blur(14px);background:${glow}"></div>
      <svg viewBox="0 0 100 100" width="${size}" height="${size}" style="position:relative">
        ${isOpen?`<g>${[-30,-15,0,15,30].map(a=>`<rect x="48" y="6" width="4" height="34" rx="2" transform="rotate(${a} 50 44)" fill="url(#ray)"/>`).join("")}</g>`:""}
        <defs>
          <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fde68a" stop-opacity="0"/><stop offset="100%" stop-color="#fde68a" stop-opacity=".9"/></linearGradient>
          <linearGradient id="pile" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fde68a"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient>
        </defs>
        <rect x="14" y="46" width="72" height="38" rx="6" fill="${wood}"/>
        <rect x="14" y="46" width="72" height="8" fill="${woodD}"/>
        <line x1="30" y1="54" x2="30" y2="84" stroke="${woodD}" stroke-width="2"/>
        <line x1="50" y1="54" x2="50" y2="84" stroke="${woodD}" stroke-width="2"/>
        <line x1="70" y1="54" x2="70" y2="84" stroke="${woodD}" stroke-width="2"/>
        <rect x="12" y="44" width="76" height="5" rx="2.5" fill="${trim}"/>
        <rect x="12" y="80" width="76" height="5" rx="2.5" fill="${trim}"/>
        ${isOpen?`<ellipse cx="50" cy="47" rx="30" ry="7" fill="url(#pile)"/><circle cx="38" cy="44" r="4" fill="#fde68a"/><circle cx="52" cy="42" r="4.5" fill="#fcd34d"/><circle cx="64" cy="44" r="4" fill="#fde68a"/><text x="50" y="41" text-anchor="middle" font-size="13">💖</text>`:""}
        <g style="transform-origin:50px 46px;${isOpen?"transform:translateY(-24px) scaleY(.55)":""};transition:transform .5s cubic-bezier(.34,1.56,.64,1)">
          <path d="M14 46 Q14 22 50 22 Q86 22 86 46 Z" fill="${wood}"/>
          <path d="M14 46 Q14 22 50 22 Q86 22 86 46" fill="none" stroke="${trim}" stroke-width="4"/>
          <line x1="35" y1="26" x2="35" y2="45" stroke="${woodD}" stroke-width="2"/>
          <line x1="65" y1="26" x2="65" y2="45" stroke="${woodD}" stroke-width="2"/>
        </g>
        ${!isOpen?`<rect x="44" y="42" width="12" height="14" rx="2" fill="${trim}"/>${locked?`<rect x="45" y="50" width="10" height="9" rx="2" fill="#374151"/><path d="M47 50 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#6b7280" stroke-width="2"/>`:`<circle cx="50" cy="49" r="2.5" fill="#2a1a10"/>`}`:""}
      </svg></div>`;
  }

  /* ── countdown ── */
  let cdTimer=null;
  function mountCountdown(el, target, onZero, label){
    if(!el) return;
    function tick(){
      const rem=target-Date.now();
      if(rem<=0){ clearInterval(cdTimer); onZero&&onZero(); return; }
      const s=Math.floor(rem/1000), dd=Math.floor(s/86400), hh=Math.floor(s%86400/3600), mm=Math.floor(s%3600/60), ss=s%60;
      const cell=(v,l)=>`<div class="cd-cell"><div class="cd-num">${String(v).padStart(2,"0")}</div><div class="cd-lab">${l}</div></div>`;
      const colon=`<div class="cd-colon">:</div>`;
      el.innerHTML=`<div class="countdown">${label?`<div class="eyebrow">${label}</div>`:""}<div class="cd-digits">${dd>0?cell(dd,"days")+colon:""}${cell(hh,"hrs")}${colon}${cell(mm,"min")}${colon}${cell(ss,"sec")}</div></div>`;
    }
    clearInterval(cdTimer); tick(); cdTimer=setInterval(tick,1000);
  }

  /* ── router ── */
  let view = {name:"boot"};
  function go(v){ view=v; clearInterval(cdTimer); render(); window.scrollTo({top:0,behavior:"smooth"}); }

  function render(){
    // auth gate
    if(!state.role){ return renderLogin(); }
    if(state.role==="admin" && (view.name==="boot")) return go({name:"admin",tab:"dash"});
    if(state.role==="player" && (view.name==="boot")) return go({name:"map"});
    switch(view.name){
      case "login": return renderLogin();
      case "map": return renderMap();
      case "riddle": return renderRiddle(view.di,view.ri);
      case "punish": return renderPunish(view.di,view.ri);
      case "finale": return renderFinale();
      case "admin": return renderAdmin(view.tab||"dash");
      default: return state.role==="admin"?renderAdmin("dash"):renderMap();
    }
  }

  /* ═══ LOGIN ═══ */
  let loginMode="player";
  function renderLogin(){
    document.querySelector(".wrap").classList.remove("wide");
    const needPlayerPw = !!(config.playerPassword && config.playerPassword.length);
    root.innerHTML = `<div class="screen login">
      <div class="bigheart">❤️</div>
      <div>
        <div class="eyebrow" style="margin-bottom:10px">Four days · Twelve riddles · One treasure</div>
        <h1 class="display romantic" style="font-size:3rem">The Treasure Hunt</h1>
      </div>
      <div class="glass panel stack">
        <div id="loginPlayer" style="${loginMode==="player"?"":"display:none"}">
          <p class="muted" style="margin-bottom:16px">A little adventure, made just for you.</p>
          ${needPlayerPw?`<div class="fieldrow"><input class="field" id="ppw" type="password" placeholder="Your secret word…"/></div>`:""}
          <button class="btn btn-rose btn-lg" id="enterPlayer" style="width:100%">Begin the Adventure ✨</button>
          <div class="divider">the keeper's door</div>
          <button class="linkbtn" id="toAdmin">🗝️ I'm the Treasure Keeper (admin)</button>
        </div>
        <div id="loginAdmin" style="${loginMode==="admin"?"":"display:none"}">
          <p class="muted" style="margin-bottom:16px">Welcome back, Keeper. Enter your password to manage the hunt.</p>
          <div class="fieldrow"><input class="field" id="apw" type="password" placeholder="Admin password"/></div>
          <button class="btn btn-gold btn-lg" id="enterAdmin" style="width:100%">Enter control panel</button>
          <div id="apwErr" class="muted" style="color:var(--bad);font-size:.85rem;margin-top:10px;display:none">That password doesn't fit the lock. Try again.</div>
          <div class="divider">or</div>
          <button class="linkbtn" id="toPlayer">← Back to the adventure</button>
        </div>
      </div>
      <p class="muted" style="font-size:.8rem">Made with love, for the one who finds it.</p>
    </div>`;

    const toAdmin=$("#toAdmin"), toPlayer=$("#toPlayer");
    if(toAdmin) toAdmin.onclick=()=>{ loginMode="admin"; renderLogin(); setTimeout(()=>$("#apw")&&$("#apw").focus(),40); };
    if(toPlayer) toPlayer.onclick=()=>{ loginMode="player"; renderLogin(); };

    const ep=$("#enterPlayer");
    if(ep) ep.onclick=()=>{
      if(needPlayerPw){ const v=($("#ppw").value||""); if(v!==config.playerPassword){ $("#ppw").style.borderColor="var(--bad)"; return; } }
      state.role="player"; saveState(); ensureMusicOnGesture(); go({name:"map"});
    };
    const pin=$("#ppw"); if(pin) pin.addEventListener("keydown",e=>{if(e.key==="Enter")ep.click();});

    const ea=$("#enterAdmin");
    if(ea) ea.onclick=()=>{
      const v=($("#apw").value||"");
      if(v!==config.adminPassword){ $("#apwErr").style.display="block"; $("#apw").style.borderColor="var(--bad)"; return; }
      state.role="admin"; saveState(); go({name:"admin",tab:"dash"});
    };
    const ain=$("#apw"); if(ain) ain.addEventListener("keydown",e=>{if(e.key==="Enter")ea.click();});
  }

  function logout(){ state.role=null; saveState(); loginMode="player"; go({name:"login"}); }

  /* ═══ player shell topbar ═══ */
  function topbar(){
    const adminBtn = state.role==="admin" ? `<button class="iconbtn" id="toAdminPanel" title="Back to admin">⚙️</button>` : "";
    const chip = state.role==="admin" ? `<span class="rolechip admin">Previewing</span>` : "";
    return `<div class="topbar">
      <div class="brand"><span>🗺️</span><span class="g">The Treasure Hunt</span></div>
      <div class="topbtns">${chip}
        <button class="iconbtn" id="music" title="Background music">${state.music?"🎵":"🔇"}</button>
        ${adminBtn}
        <button class="iconbtn" id="logout" title="${state.role==='admin'?'Log out':'Leave'}">⎋</button>
      </div></div>`;
  }
  function wireTop(){
    const m=$("#music"); if(m) m.onclick=toggleMusic;
    const lo=$("#logout"); if(lo) lo.onclick=logout;
    const ap=$("#toAdminPanel"); if(ap) ap.onclick=()=>go({name:"admin",tab:"dash"});
  }

  /* ═══ MAP ═══ */
  function renderMap(){
    document.querySelector(".wrap").classList.remove("wide");
    const {total,done}=totals();
    const pct=total?Math.round(done/total*100):0;
    const allDone=total>0&&done===total;
    const cur=firstUnsolved();
    const nextLock=nextLockedUnlock();

    const islands=config.days.map((day,di)=>{
      const dayDone=day.riddles.every((_,ri)=>state.solved[rid(di,ri)]);
      const anyOpen=day.riddles.some((_,ri)=>riddleState(di,ri)!=="locked");
      const chests=day.riddles.map((r,ri)=>{
        const st=riddleState(di,ri);
        const variant=st==="done"?"done":st==="locked"?"locked":"unlocked";
        const cap=st==="done"?`<span class="cap done">✨ solved</span>`:st==="locked"?`<span class="cap locked">🔒</span>`:`<span class="cap open">riddle ${ri+1}</span>`;
        return `<button class="chest" ${st==="locked"?"disabled":""} data-open="${di}-${ri}" aria-label="${esc(r.title)}">${chestSVG(variant,false,58)}${cap}</button>`;
      }).join("");
      return `<div class="glass island ${dayDone?"done":anyOpen?"active":""}">
        <svg class="palm" viewBox="0 0 100 90" aria-hidden="true"><g transform="translate(50,40)"><rect x="-2" y="0" width="4" height="26" rx="2" fill="#6b4a24"/><path d="M0,2 Q-16,-8 -24,0 Q-11,-3 0,5 Z" fill="#3f7a4f"/><path d="M0,2 Q16,-8 24,0 Q11,-3 0,5 Z" fill="#3f7a4f"/><path d="M0,0 Q-5,-16 -16,-16 Q-5,-11 0,3 Z" fill="#4c9a63"/><path d="M0,0 Q5,-16 16,-16 Q5,-11 0,3 Z" fill="#4c9a63"/></g></svg>
        <div class="eyebrow">Day ${di+1} · ${esc(day.island)}${dayDone?" · 🏆":""}</div>
        <h3 class="display">${esc(day.title)}</h3>
        <p class="isle-story muted serif-body">${esc(day.story)}</p>
        <div class="chests">${chests}</div></div>`;
    }).join("");

    root.innerHTML = topbar() + `<div class="screen">
      <div class="center" style="margin:6px 0 18px">
        <div class="eyebrow">Day ${cur?cur.di+1:config.days.length} of ${config.days.length}</div>
        <h1 class="display romantic" style="font-size:2.2rem;margin-top:4px">Hello, ${esc(config.playerName)} ❤️</h1>
      </div>
      <div class="glass card progresswrap">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span class="muted" style="font-size:.9rem">Treasure progress</span>
          <span class="display treasure" style="font-size:1.2rem">${done} / ${total}</span>
        </div>
        <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
        ${allDone?`<div class="center" style="margin-top:18px"><button class="btn btn-gold" id="toFinale">🏆 Claim your treasure →</button></div>`:""}
      </div>
      ${!allDone&&cur?currentMission(cur):""}
      ${!allDone&&nextLock&&cur&&riddleState(cur.di,cur.ri)!=="locked"?`<div class="glass card" id="nextcd" style="margin-bottom:26px"></div>`:""}
      <h2 class="center display treasure" style="font-size:1.5rem;margin:8px 0 20px">🗺️ The Treasure Map</h2>
      <div class="map">${islands}</div>
    </div>`;

    wireTop();
    root.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ const [di,ri]=b.dataset.open.split("-").map(Number); openRiddle(di,ri); });
    const tf=$("#toFinale"); if(tf) tf.onclick=()=>go({name:"finale"});
    const cm=$("#missionBtn"); if(cm) cm.onclick=()=>{ const c=firstUnsolved(); if(c) openRiddle(c.di,c.ri); };
    if(cur) mountCountdown($("#missioncd"), unlockAt(cur.di,cur.ri).getTime(), ()=>go({name:"map"}), "Next riddle unlocks in");
    if(nextLock) mountCountdown($("#nextcd"), nextLock, ()=>go({name:"map"}), "Next chest unlocks in");
  }
  function currentMission(cur){
    const st=riddleState(cur.di,cur.ri), r=config.days[cur.di].riddles[cur.ri];
    if(st==="locked") return `<div class="glass card" style="margin-bottom:26px"><div class="center stack"><div class="eyebrow">Current mission</div><h2 class="display" style="font-size:1.6rem">🔒 Locked</h2><p class="muted">The next chest is sealed by time itself. It opens on its own — no refresh needed.</p><div id="missioncd"></div></div></div>`;
    const label=st==="punish"?"🎭 Punishment awaits":"🗝️ Ready to solve";
    return `<div class="glass card" style="margin-bottom:26px;border-color:rgba(244,114,182,.3)"><div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap"><div><div class="eyebrow">Current mission</div><h2 class="display" style="font-size:1.5rem;margin-top:4px">${esc(r.title)}</h2><p class="muted" style="font-size:.9rem">${esc(config.days[cur.di].island)} · ${label}</p></div><button class="btn btn-rose" id="missionBtn">Open the chest →</button></div></div>`;
  }
  function openRiddle(di,ri){ const st=riddleState(di,ri); go({name: st==="punish"?"punish":"riddle", di, ri}); }

  /* ═══ RIDDLE ═══ */
  function renderRiddle(di,ri){
    document.querySelector(".wrap").classList.remove("wide");
    const day=config.days[di], r=day.riddles[ri], st=riddleState(di,ri);
    if(st==="locked"){
      root.innerHTML=topbar()+`<div class="screen"><button class="backlink" id="back">← Back to the map</button>
        <div class="glass card center stack"><div class="chest-stage">${chestSVG("locked",false,140)}</div>
        <h1 class="display" style="font-size:2.2rem">🔒 Locked</h1>
        <p class="muted">This chest is sealed until its moment arrives. It opens all by itself — magic needs no refresh button.</p>
        <div id="cd"></div></div></div>`;
      wireTop(); wireBack(); mountCountdown($("#cd"), unlockAt(di,ri).getTime(), ()=>go({name:"riddle",di,ri}), "Opens in"); return;
    }
    root.innerHTML=topbar()+`<div class="screen"><button class="backlink" id="back">← Back to the map</button>
      <div class="stack">
        <div class="center"><div class="eyebrow">Day ${di+1} · Riddle ${ri+1}</div><h1 class="display romantic" style="font-size:2.5rem;margin-top:6px">${esc(r.title)}</h1></div>
        <div class="chest-stage">${chestSVG(st==="done"?"done":"unlocked",false,150)}</div>
        ${r.story?`<p class="center serif-body" style="font-size:1.12rem;max-width:34rem;margin:0 auto">${esc(r.story)}</p>`:""}
        <div class="glass card"><div class="qbox"><div class="eyebrow" style="margin-bottom:8px">The question</div><p class="display" style="font-size:1.35rem">${esc(r.question)}</p></div>
        <div id="answerArea" style="margin-top:18px"></div></div>
      </div></div>`;
    wireTop(); wireBack(); renderAnswerArea(di,ri);
  }
  function renderAnswerArea(di,ri){
    const area=$("#answerArea"); if(!area) return;
    const r=config.days[di].riddles[ri];
    area.innerHTML=`<div class="answer-row"><input class="field serif" id="ans" placeholder="Whisper your answer…" autocomplete="off" maxlength="400"/><button class="btn btn-rose" id="submit">Submit</button></div>
      <p class="muted" style="font-size:.78rem;margin-top:10px;text-align:center">${r.answers===null?"Answer from the heart — anything you write is accepted.":"Type your best guess. Trust yourself. 💫"}</p>`;
    const input=$("#ans"), btn=$("#submit"); input.focus();
    const submit=()=>{ const v=input.value; if(!v.trim())return; checks(v,r.answers)?onCorrect(di,ri):onWrong(di,ri); };
    btn.onclick=submit; input.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
  }
  function onCorrect(di,ri){
    state.solved[rid(di,ri)]=true; delete state.punish[rid(di,ri)]; saveState();
    burstConfetti(); setTimeout(heartConfetti,300);
    const stage=$(".chest-stage"); if(stage) stage.innerHTML=chestSVG("done",true,150);
    const {total,done}=totals(), allDone=done===total, area=$("#answerArea");
    if(area){
      area.innerHTML=`<div class="note good" style="animation:fade .5s both"><p class="display" style="font-size:1.9rem">✨ Correct!</p><p class="muted" style="margin-top:6px">Another piece of the map is yours.</p><div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${allDone?`<button class="btn btn-gold" id="fin">🏆 Claim your treasure →</button>`:`<button class="btn btn-rose" id="cont">Continue the voyage →</button>`}</div></div>`;
      const c=$("#cont"); if(c) c.onclick=()=>go({name:"map"});
      const f=$("#fin"); if(f) f.onclick=()=>go({name:"finale"});
    }
  }
  function onWrong(di,ri){ state.punish[rid(di,ri)]=true; saveState(); go({name:"punish",di,ri}); }

  /* ═══ PUNISHMENT ═══ */
  function renderPunish(di,ri){
    document.querySelector(".wrap").classList.remove("wide");
    const r=config.days[di].riddles[ri], p=r.punishment||{title:"A Tiny Dare",description:"Blow me a kiss and try again."};
    root.innerHTML=topbar()+`<div class="screen"><button class="backlink" id="back">← Back to the map</button>
      <div class="stack">
        <div class="center"><div style="font-size:3.2rem;animation:${reduce?"none":"beat 1.6s ease-in-out infinite"}">🎭</div><div class="eyebrow" style="margin-top:8px">Wrong answer!</div><h1 class="display romantic" style="font-size:2.2rem;margin-top:4px">${esc(p.title)}</h1></div>
        <div class="glass card center"><p class="serif-body" style="font-size:1.15rem">${esc(p.description)}</p></div>
        <div class="note bad center">Before you can try “${esc(r.title)}” again, you must complete your punishment. 😌</div>
        <div class="center"><button class="btn btn-gold btn-lg" id="did">I did it — let me try again 💪</button></div>
      </div></div>`;
    wireTop(); wireBack();
    $("#did").onclick=()=>{ delete state.punish[rid(di,ri)]; saveState(); go({name:"riddle",di,ri}); };
  }

  /* ═══ FINALE ═══ */
  function renderFinale(){
    document.querySelector(".wrap").classList.remove("wide");
    const {total,done}=totals();
    if(!(total>0&&done===total)){
      root.innerHTML=topbar()+`<div class="screen center stack" style="min-height:60dvh;justify-content:center"><div style="font-size:3rem">🔐</div><h1 class="display" style="font-size:2rem">Not yet, my love…</h1><p class="muted">The final treasure only appears when every riddle is solved.</p><div><button class="btn btn-rose" id="back">← Back to the hunt</button></div></div>`;
      wireTop(); wireBack(); return;
    }
    const f=config.finale;
    root.innerHTML=`<div class="screen finale" id="finaleRoot">
      <div><div class="eyebrow" style="margin-bottom:10px">Every riddle solved</div><h1 class="display treasure" style="font-size:3rem">${esc(f.treasureTitle||"The Final Treasure")}</h1></div>
      <div>${chestSVG("unlocked",false,190)}</div>
      <button class="btn btn-gold btn-lg" id="openChest">Open the chest ✨</button></div>`;
    ensureMusicOnGesture();
    $("#openChest").onclick=revealFinale;
  }
  function revealFinale(){
    const f=config.finale, el=$("#finaleRoot");
    el.innerHTML=`<div>${chestSVG("done",true,200)}</div>`;
    burstConfetti(); fireworks(9000); setTimeout(heartConfetti,700);
    setTimeout(()=>{
      el.innerHTML=`<div class="center"><div style="font-size:2.6rem;animation:${reduce?"none":"beat 1.5s ease-in-out infinite"}">❤️</div><h1 class="display treasure" style="font-size:2.8rem;margin-top:8px">${esc(f.treasureTitle||"The Final Treasure")}</h1></div>
        <div class="chest-stage">${chestSVG("done",true,150)}</div>
        ${f.treasureImage?`<img class="treasure-img" src="${escAttr(f.treasureImage)}" alt="Your treasure"/>`:""}
        ${f.treasureMessage?`<p class="serif-body center" style="font-size:1.2rem;max-width:34rem">${esc(f.treasureMessage)}</p>`:""}
        ${f.loveLetter?`<div class="letter">${esc(f.loveLetter)}</div>`:""}
        <p class="muted" style="font-size:.9rem">The End… and also, always, the beginning. ❤️</p>
        <button class="btn btn-ghost" id="replay">Return to the map</button>`;
      const rp=$("#replay"); if(rp) rp.onclick=()=>go({name:"map"});
    },1500);
  }

  /* ═══════════════════ ADMIN CONTROL PANEL ═══════════════════ */
  function adminShell(activeTab, inner){
    document.querySelector(".wrap").classList.add("wide");
    const tabs=[["dash","Dashboard"],["riddles","Riddles"],["settings","Settings"],["finale","Finale"],["share","Share"]];
    return `<div class="topbar"><div class="brand"><span>🧭</span><span class="g" style="background:linear-gradient(100deg,#fde68a,#fbbf24,#fff7db,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent">Treasure Keeper</span></div>
      <div class="topbtns"><span class="rolechip admin">Admin</span>
        <button class="iconbtn" id="preview" title="Preview the hunt">👁️</button>
        <button class="iconbtn" id="logout" title="Log out">⎋</button></div></div>
      <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${activeTab===k?"active":""}" data-tab="${k}">${l}</button>`).join("")}</div>
      <div class="screen">${inner}</div>`;
  }
  function wireAdminShell(){
    root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>go({name:"admin",tab:b.dataset.tab}));
    const pv=$("#preview"); if(pv) pv.onclick=()=>go({name:"map"});
    const lo=$("#logout"); if(lo) lo.onclick=logout;
  }
  function renderAdmin(tab){
    if(tab==="dash") return renderAdminDash();
    if(tab==="riddles") return renderAdminRiddles();
    if(tab==="settings") return renderAdminSettings();
    if(tab==="finale") return renderAdminFinale();
    if(tab==="share") return renderAdminShare();
  }

  function renderAdminDash(){
    const {total,done}=totals();
    const now=Date.now();
    let unlocked=0; config.days.forEach((d,di)=>d.riddles.forEach((_,ri)=>{ if(isUnlocked(di,ri))unlocked++; }));
    const cur=firstUnsolved();
    const curDay=cur?cur.di+1:config.days.length;
    const missing=[]; config.days.forEach((d,di)=>d.riddles.forEach((r,ri)=>{ if(Array.isArray(r.answers)&&r.answers.some(a=>/edit me/i.test(a))) missing.push(`Day ${di+1} · Riddle ${ri+1}`); }));

    const rows=config.days.map((d,di)=>d.riddles.map((r,ri)=>{
      const solved=!!state.solved[rid(di,ri)];
      const st=riddleState(di,ri);
      return `<div class="prow"><div><strong>${esc(r.title)}</strong><div class="muted" style="font-size:.78rem">Day ${di+1} · Riddle ${ri+1} · unlocks ${fmt(unlockAt(di,ri))}</div></div>
        <span class="badge ${solved?"done":"todo"}">${solved?"✨ solved":st==="locked"?"🔒 locked":st==="punish"?"🎭 punishment":"open"}</span></div>`;
    }).join("")).join("");

    root.innerHTML=adminShell("dash",`
      <h1 class="display treasure" style="font-size:2rem;margin-bottom:4px">Keeper's Deck</h1>
      <p class="muted" style="margin-bottom:20px">Everything about the hunt at a glance. Progress shown is for this device.</p>
      <div class="stat-grid">
        <div class="glass stat"><div class="k">Current day</div><div class="v">${curDay} / ${config.days.length}</div></div>
        <div class="glass stat"><div class="k">Unlocked riddles</div><div class="v">${unlocked} / ${total}</div></div>
        <div class="glass stat"><div class="k">Completed</div><div class="v">${done} / ${total}</div></div>
        <div class="glass stat"><div class="k">Player</div><div class="v" style="font-size:1.2rem">${esc(config.playerName)}</div></div>
      </div>
      ${missing.length?`<div class="warn" style="margin-bottom:20px">⚠️ ${missing.length} riddle${missing.length>1?"s":""} still show the placeholder answer “EDIT ME”. Set real answers in the <strong>Riddles</strong> tab: ${missing.join(", ")}.</div>`:""}
      <div class="glass card"><h2 class="display" style="font-size:1.3rem;margin-bottom:14px">Her journey</h2>${rows}
      <div style="margin-top:14px"><button class="btn btn-danger btn-sm" id="resetProg">Reset her progress</button></div></div>
    `);
    wireAdminShell();
    $("#resetProg").onclick=()=>{ if(confirm("Reset all of her progress on this device? This cannot be undone.")){ state.solved={}; state.punish={}; saveState(); go({name:"admin",tab:"dash"}); } };
  }

  function renderAdminRiddles(){
    const days=config.days.map((day,di)=>{
      const riddles=day.riddles.map((r,ri)=>{
        const anyAns = r.answers===null;
        return `<div class="admin-riddle">
          <div class="rh"><strong>Riddle ${ri+1}</strong><button class="btn btn-danger btn-sm" data-delr="${di}-${ri}">Delete</button></div>
          <div class="fieldrow"><label class="lbl">Title</label><input class="field" data-path="days.${di}.riddles.${ri}.title" value="${escAttr(r.title)}"/></div>
          <div class="fieldrow"><label class="lbl">Story</label><textarea class="ta" data-path="days.${di}.riddles.${ri}.story">${esc(r.story)}</textarea></div>
          <div class="fieldrow"><label class="lbl">Question</label><textarea class="ta" data-path="days.${di}.riddles.${ri}.question">${esc(r.question)}</textarea></div>
          <div class="fieldrow">
            <label class="lbl">Accepted answers (separate with commas)</label>
            <input class="field" data-answers="${di}-${ri}" value="${anyAns?"":escAttr((r.answers||[]).join(", "))}" ${anyAns?"disabled":""} placeholder="paris, we met in paris"/>
            <label class="chk" style="margin-top:10px"><input type="checkbox" data-anyans="${di}-${ri}" ${anyAns?"checked":""}/> Accept any answer she writes (for “describe a memory” riddles)</label>
          </div>
          <div class="grid2">
            <div class="fieldrow"><label class="lbl">Punishment title</label><input class="field" data-path="days.${di}.riddles.${ri}.punishment.title" value="${escAttr(r.punishment?r.punishment.title:"")}"/></div>
            <div class="fieldrow"><label class="lbl">Punishment task</label><input class="field" data-path="days.${di}.riddles.${ri}.punishment.description" value="${escAttr(r.punishment?r.punishment.description:"")}"/></div>
          </div>
        </div>`;
      }).join("");
      return `<div class="glass admin-day">
        <div class="dayhead"><div><span class="eyebrow">Day ${di+1}</span></div><button class="btn btn-danger btn-sm" data-deld="${di}">Delete day</button></div>
        <div class="grid2">
          <div class="fieldrow"><label class="lbl">Day title</label><input class="field" data-path="days.${di}.title" value="${escAttr(day.title)}"/></div>
          <div class="fieldrow"><label class="lbl">Island name</label><input class="field" data-path="days.${di}.island" value="${escAttr(day.island)}"/></div>
        </div>
        <div class="fieldrow"><label class="lbl">Day story</label><textarea class="ta" data-path="days.${di}.story">${esc(day.story)}</textarea></div>
        ${riddles}
        ${day.riddles.length<3?`<button class="btn btn-ghost btn-sm" data-addr="${di}">+ Add riddle (${day.riddles.length}/3)</button>`:`<p class="hint">3 riddles per day (matches the 3 daily unlock times).</p>`}
      </div>`;
    }).join("");

    root.innerHTML=adminShell("riddles",`
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px">
        <div><h1 class="display treasure" style="font-size:2rem">Riddles</h1><p class="muted">Edits save automatically. <span class="savedtag" id="saved">✓ saved</span></p></div>
        <button class="btn btn-ghost btn-sm" id="addDay">+ Add day</button>
      </div>
      ${days}`);
    wireAdminShell();

    // bind text/textarea inputs
    root.querySelectorAll("[data-path]").forEach(inp=>{
      inp.addEventListener("input",()=>{ setPath(config, inp.dataset.path, inp.value); saveConfig(); flashSaved(); });
    });
    // answers
    root.querySelectorAll("[data-answers]").forEach(inp=>{
      inp.addEventListener("input",()=>{ const [di,ri]=inp.dataset.answers.split("-").map(Number);
        config.days[di].riddles[ri].answers = inp.value.split(",").map(s=>s.trim()).filter(Boolean);
        saveConfig(); flashSaved(); });
    });
    root.querySelectorAll("[data-anyans]").forEach(cb=>{
      cb.addEventListener("change",()=>{ const [di,ri]=cb.dataset.anyans.split("-").map(Number);
        if(cb.checked){ config.days[di].riddles[ri].answers=null; } else { config.days[di].riddles[ri].answers=[""]; }
        saveConfig(); go({name:"admin",tab:"riddles"}); });
    });
    // structure
    root.querySelectorAll("[data-delr]").forEach(b=>b.onclick=()=>{ const [di,ri]=b.dataset.delr.split("-").map(Number);
      if(confirm("Delete this riddle?")){ config.days[di].riddles.splice(ri,1); saveConfig(); go({name:"admin",tab:"riddles"}); } });
    root.querySelectorAll("[data-addr]").forEach(b=>b.onclick=()=>{ const di=+b.dataset.addr;
      config.days[di].riddles.push({title:"New Riddle",story:"",question:"Your question here?",answers:["answer"],punishment:{title:"A tiny dare",description:"Blow me a kiss and try again."}});
      saveConfig(); go({name:"admin",tab:"riddles"}); });
    root.querySelectorAll("[data-deld]").forEach(b=>b.onclick=()=>{ const di=+b.dataset.deld;
      if(confirm("Delete this whole day and its riddles?")){ config.days.splice(di,1); saveConfig(); go({name:"admin",tab:"riddles"}); } });
    $("#addDay").onclick=()=>{ config.days.push({title:"New Day",island:"Mystery Island",story:"",riddles:[{title:"New Riddle",story:"",question:"Your question here?",answers:["answer"],punishment:{title:"A tiny dare",description:"Blow me a kiss and try again."}}]}); saveConfig(); go({name:"admin",tab:"riddles"}); };
  }

  function renderAdminSettings(){
    const t=config.slotTimes||["10:00","14:00","21:00"];
    root.innerHTML=adminShell("settings",`
      <h1 class="display treasure" style="font-size:2rem;margin-bottom:4px">Settings</h1>
      <p class="muted" style="margin-bottom:20px">The hunt's schedule and access. <span class="savedtag" id="saved">✓ saved</span></p>
      <div class="glass card stack">
        <div class="grid2">
          <div><label class="lbl">Her name</label><input class="field" data-path="playerName" value="${escAttr(config.playerName)}"/></div>
          <div><label class="lbl">Day 1 date</label><input class="field" type="date" data-path="startDate" value="${escAttr(config.startDate)}"/></div>
        </div>
        <div>
          <label class="lbl">Daily unlock times (riddle 1 · 2 · 3)</label>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <input class="field" type="time" data-slot="0" value="${escAttr(t[0]||"10:00")}" style="flex:1"/>
            <input class="field" type="time" data-slot="1" value="${escAttr(t[1]||"14:00")}" style="flex:1"/>
            <input class="field" type="time" data-slot="2" value="${escAttr(t[2]||"21:00")}" style="flex:1"/>
          </div>
          <p class="hint">Each day, riddle 1 opens at the first time, riddle 2 at the second, riddle 3 at the third.</p>
        </div>
        <label class="chk"><input type="checkbox" id="unlockAll" ${config.unlockAll?"checked":""}/> Unlock everything now (turn on for testing, off for the real hunt)</label>
        <hr style="border:0;border-top:1px solid var(--panel-line)"/>
        <div class="grid2">
          <div><label class="lbl">Admin password</label><input class="field" data-path="adminPassword" value="${escAttr(config.adminPassword)}"/><p class="hint">Only you should know this.</p></div>
          <div><label class="lbl">Her password (optional)</label><input class="field" data-path="playerPassword" value="${escAttr(config.playerPassword)}" placeholder="leave blank for none"/><p class="hint">A secret word she types to enter. Blank = no password.</p></div>
        </div>
      </div>`);
    wireAdminShell();
    root.querySelectorAll("[data-path]").forEach(inp=>inp.addEventListener("input",()=>{ setPath(config,inp.dataset.path,inp.value); saveConfig(); flashSaved(); }));
    root.querySelectorAll("[data-slot]").forEach(inp=>inp.addEventListener("input",()=>{ config.slotTimes[+inp.dataset.slot]=inp.value; saveConfig(); flashSaved(); }));
    $("#unlockAll").addEventListener("change",e=>{ config.unlockAll=e.target.checked; saveConfig(); flashSaved(); });
  }

  function renderAdminFinale(){
    const f=config.finale;
    root.innerHTML=adminShell("finale",`
      <h1 class="display treasure" style="font-size:2rem;margin-bottom:4px">The Finale</h1>
      <p class="muted" style="margin-bottom:20px">Revealed only after she solves all riddles. <span class="savedtag" id="saved">✓ saved</span></p>
      <div class="glass card stack">
        <div><label class="lbl">Treasure title</label><input class="field" data-path="finale.treasureTitle" value="${escAttr(f.treasureTitle)}"/></div>
        <div><label class="lbl">Reveal message</label><textarea class="ta" data-path="finale.treasureMessage">${esc(f.treasureMessage)}</textarea></div>
        <div><label class="lbl">💌 Love letter</label><textarea class="ta" style="min-height:200px" data-path="finale.loveLetter">${esc(f.loveLetter)}</textarea></div>
        <div><label class="lbl">Treasure image URL (optional)</label><input class="field" data-path="finale.treasureImage" value="${escAttr(f.treasureImage)}" placeholder="https://…  (a photo, a gift, a place)"/></div>
      </div>
      <div class="center" style="margin-top:18px"><button class="btn btn-gold" id="previewFinale">Preview the finale →</button></div>`);
    wireAdminShell();
    root.querySelectorAll("[data-path]").forEach(inp=>inp.addEventListener("input",()=>{ setPath(config,inp.dataset.path,inp.value); saveConfig(); flashSaved(); }));
    $("#previewFinale").onclick=()=>{
      // temporarily mark all solved just for the preview session (kept — admin can reset)
      alert("This opens the finale as she'll see it. (Her real progress is unaffected — you can reset it in Dashboard.)");
      config.days.forEach((d,di)=>d.riddles.forEach((_,ri)=>state.solved[rid(di,ri)]=true)); saveState(); go({name:"finale"});
    };
  }

  function renderAdminShare(){
    root.innerHTML=adminShell("share",`
      <h1 class="display treasure" style="font-size:2rem;margin-bottom:4px">Share & Save</h1>
      <p class="muted" style="margin-bottom:20px">Bundle everything you've written into one file to send her.</p>
      <div class="glass card stack">
        <div>
          <h2 class="display" style="font-size:1.3rem">📦 Download her copy</h2>
          <p class="muted" style="margin:6px 0 14px">Creates a ready-to-play HTML file with all your riddles, answers, punishments and love letter baked in. Send it to her (WhatsApp, email, AirDrop) — she just opens it. Your admin password is included so you can still edit hers later, so keep it a little private.</p>
          <button class="btn btn-gold" id="dl">Download the file for her</button>
        </div>
        <hr style="border:0;border-top:1px solid var(--panel-line)"/>
        <div>
          <h2 class="display" style="font-size:1.3rem">🔗 Copy your setup</h2>
          <p class="muted" style="margin:6px 0 14px">Copies your whole setup as text — a backup you can paste to me, or keep safe.</p>
          <button class="btn btn-ghost" id="copyCfg">Copy setup to clipboard</button>
          <span class="savedtag" id="copied">✓ copied</span>
        </div>
        <hr style="border:0;border-top:1px solid var(--panel-line)"/>
        <div>
          <h2 class="display" style="font-size:1.3rem">↺ Start over</h2>
          <p class="muted" style="margin:6px 0 14px">Throw away your edits and return to the original sample content.</p>
          <button class="btn btn-danger" id="resetAll">Reset all content to defaults</button>
        </div>
      </div>`);
    wireAdminShell();
    $("#dl").onclick=exportPlayerCopy;
    $("#copyCfg").onclick=()=>{ navigator.clipboard.writeText(JSON.stringify(config,null,2)).then(()=>{ const c=$("#copied"); c.classList.add("show"); setTimeout(()=>c.classList.remove("show"),1500); }); };
    $("#resetAll").onclick=()=>{ if(confirm("Reset ALL riddles, settings and the finale back to the original sample? Your edits will be lost.")){ resetConfig(); go({name:"admin",tab:"riddles"}); } };
  }

  function exportPlayerCopy(){
    const cfg=JSON.stringify(config).replace(/</g,"\\u003c");
    const inject=`<script>window.__BAKED_CONFIG__=${cfg};<\/script>\n`;
    const html=PRISTINE_HTML.replace("</head>", inject+"</head>");
    const blob=new Blob([html],{type:"text/html"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="the-treasure-hunt-for-her.html"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }

  let savedTimer=null;
  function flashSaved(){ const s=$("#saved"); if(!s)return; s.classList.add("show"); clearTimeout(savedTimer); savedTimer=setTimeout(()=>s.classList.remove("show"),1200); }

  /* ── shared ── */
  function wireBack(){ const b=$("#back"); if(b) b.onclick=()=>go({name:state.role==="admin"?"admin":"map", tab:"dash"}); }
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function escAttr(s){ return esc(s); }
  function fmt(d){ try{ return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }catch{ return ""; } }

  /* ═══ ambient sky + hearts ═══ */
  function buildSky(){
    const sky=document.getElementById("sky"); if(sky){ let h=""; const N=innerWidth<600?42:70;
      for(let i=0;i<N;i++){ const g=Math.random()<.25, s=1+Math.random()*(g?2.5:2.2);
        h+=`<span class="star ${g?"gold":""}" style="left:${Math.random()*100}%;top:${Math.random()*100}%;width:${s}px;height:${s}px;--d:${2+Math.random()*3}s;animation-delay:${Math.random()*4}s"></span>`; }
      sky.innerHTML=h; }
    const hearts=document.getElementById("hearts"); if(hearts){ let h=""; const H=innerWidth<600?7:12;
      for(let i=0;i<H;i++){ const size=12+Math.random()*22, dur=15+Math.random()*16;
        h+=`<span class="heart" style="left:${Math.random()*100}%;font-size:${size}px;--o:${.12+Math.random()*.22};--rot:${Math.random()*40-20}deg;animation-duration:${dur}s;animation-delay:${Math.random()*20}s">❤</span>`; }
      hearts.innerHTML=h; }
  }

  /* ═══ confetti / fireworks ═══ */
  const cv=document.getElementById("fx"), ctx=cv.getContext("2d");
  let parts=[], raf=null;
  function sizeCanvas(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  sizeCanvas();
  const COLORS=["#f472b6","#fbbf24","#fb7185","#fde68a","#ffffff","#c084fc"];
  function spawn(x,y,n,power,heart){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=power*(0.4+Math.random());
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-power*.4,life:1,size:heart?9:5+Math.random()*5,color:COLORS[i%COLORS.length],heart,rot:Math.random()*6.28,vr:(Math.random()-.5)*.3}); }
    if(!raf) loop(); }
  function loop(){ ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{ p.vy+=.12; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.life-=.012; p.rot+=p.vr;
      ctx.globalAlpha=Math.max(0,p.life); ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      if(p.heart){ ctx.font=`${p.size*2}px serif`; ctx.textAlign="center"; ctx.fillText("❤️",0,0); }
      else { ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6); } ctx.restore(); });
    ctx.globalAlpha=1; parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
    if(parts.length){ raf=requestAnimationFrame(loop); } else { raf=null; ctx.clearRect(0,0,cv.width,cv.height); } }
  function burstConfetti(){ if(reduce)return; spawn(innerWidth*.5,innerHeight*.55,120,9,false); }
  function heartConfetti(){ if(reduce)return; spawn(innerWidth*.5,innerHeight*.5,22,7,true); }
  function fireworks(ms){ if(reduce)return; const end=Date.now()+ms;(function s(){ if(Date.now()>end)return; spawn(innerWidth*(.15+Math.random()*.7),innerHeight*(.2+Math.random()*.4),46,8,false); setTimeout(s,350); })(); }

  /* ═══ generated music-box ═══ */
  let audioCtx=null, musicTimer=null, master=null;
  function startMusic(){ if(audioCtx)return; try{ const AC=window.AudioContext||window.webkitAudioContext; audioCtx=new AC();
    master=audioCtx.createGain(); master.gain.value=.16; master.connect(audioCtx.destination);
    const chords=[[220,261.63,329.63],[174.61,220,261.63],[130.81,164.81,196,261.63],[196,246.94,293.66]]; let step=0;
    const note=(f,t,d)=>{ const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type="sine"; o.frequency.value=f*2;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.5,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.05); };
    musicTimer=setInterval(()=>{ const ch=chords[Math.floor(step/8)%chords.length]; note(ch[step%ch.length],audioCtx.currentTime,1.6);
      if(step%8===0) note(ch[0]/2,audioCtx.currentTime,3); step++; },400);
  }catch(e){} }
  function stopMusic(){ if(musicTimer){clearInterval(musicTimer);musicTimer=null;} if(audioCtx){audioCtx.close();audioCtx=null;} }
  function toggleMusic(){ state.music=!state.music; saveState(); const m=$("#music"); if(m)m.textContent=state.music?"🎵":"🔇"; state.music?startMusic():stopMusic(); }
  function ensureMusicOnGesture(){ if(state.music&&!audioCtx) startMusic(); }

  /* ═══ boot ═══ */
  window.addEventListener("resize",sizeCanvas);
  document.addEventListener("click",()=>{ if(state.music&&!audioCtx) startMusic(); });
  buildSky();
  go({name:"boot"});
})();
</script>
