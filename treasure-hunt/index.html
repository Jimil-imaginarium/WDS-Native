<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0F0F10" />
<title>The Story of Us ❤️</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖤</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root{
  --bg:#0F0F10; --bg2:#151517; --panel:rgba(24,24,27,.72); --panel-solid:#161619;
  --gold:#D4AF37; --gold-2:#E8CE7A; --gold-deep:#B8912E;
  --ink:#EDE7DA; --ink-soft:#9C9384; --line:rgba(212,175,55,.20); --line-soft:rgba(212,175,55,.10);
  --radius:18px; --radius-sm:12px;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --gold-grad:linear-gradient(135deg,#E8CE7A 0%,#D4AF37 45%,#B8912E 100%);
  --shadow:0 30px 80px -30px rgba(0,0,0,.85); --shadow-sm:0 12px 30px -14px rgba(0,0,0,.7);
  --glow:0 0 24px rgba(212,175,55,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  background-image:
    radial-gradient(900px 500px at 50% -8%,rgba(212,175,55,.10),transparent 60%),
    radial-gradient(700px 600px at 110% 20%,rgba(212,175,55,.06),transparent 55%),
    radial-gradient(700px 700px at -10% 90%,rgba(212,175,55,.05),transparent 55%);
  background-attachment:fixed; -webkit-font-smoothing:antialiased; line-height:1.55; overflow-x:hidden;
}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:.3px;line-height:1.08}
.muted{color:var(--ink-soft)}
.center{text-align:center}
.gold{color:var(--gold)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px}
a{color:var(--gold-2);text-decoration:none}
::selection{background:rgba(212,175,55,.3);color:#fff}
.eyebrow{font-size:11.5px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:600}

.app{min-height:100dvh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:22px 18px 110px;flex:1}
.topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  background:linear-gradient(180deg,rgba(15,15,16,.85),rgba(15,15,16,.35));border-bottom:1px solid var(--line-soft)}
.topbar-in{max-width:1040px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--serif);font-size:20px;font-weight:700;display:flex;align-items:center;gap:9px;cursor:pointer;letter-spacing:.5px}
.brand .em{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--panel);
  border:1px solid var(--line);box-shadow:var(--shadow-sm);transition:.2s;position:relative;color:var(--ink)}
.iconbtn:hover{transform:translateY(-2px);border-color:var(--gold)}
.iconbtn svg{width:18px;height:18px}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--gold);color:#1a1508;font-size:11px;font-weight:800;display:grid;place-items:center}

.card{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.card.solid{background:var(--panel-solid)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;gap:12px;align-items:center} .wrap-flex{flex-wrap:wrap}
.divider{height:1px;background:var(--line-soft);margin:16px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;
  font-weight:700;font-size:14px;letter-spacing:.3px;background:var(--gold-grad);color:#1a1407;box-shadow:var(--shadow-sm);
  transition:transform .15s,box-shadow .2s,opacity .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.soft{background:rgba(212,175,55,.12);color:var(--gold-2);border:1px solid var(--line)}
.btn.danger{background:transparent;color:#e59a8f;border:1px solid rgba(229,154,143,.5)}
.btn.sm{padding:8px 15px;font-size:12.5px} .btn.block{width:100%}

label.fld{display:block;margin:14px 0 6px;font-size:11.5px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:1.4px}
.input,textarea.input,select.input{width:100%;padding:13px 15px;border-radius:var(--radius-sm);border:1px solid var(--line);
  background:rgba(0,0,0,.35);color:var(--ink);outline:none;transition:.2s}
.input::placeholder{color:#6d685c}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.14)}
textarea.input{min-height:100px;resize:vertical;line-height:1.7}

.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.pill.wait{background:rgba(212,175,55,.14);color:var(--gold-2);border:1px solid var(--line)}
.pill.ok{background:rgba(120,200,140,.14);color:#8fd6a3;border:1px solid rgba(120,200,140,.3)}
.pill.bad{background:rgba(229,154,143,.14);color:#e59a8f;border:1px solid rgba(229,154,143,.3)}
.pill.info{background:rgba(212,175,55,.1);color:var(--gold);border:1px solid var(--line-soft)}

/* wax seal */
.seal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:radial-gradient(circle at 35% 30%,#E8CE7A,#B8912E 70%,#8a6c1f);
  box-shadow:inset 0 2px 6px rgba(255,255,255,.4),inset 0 -4px 10px rgba(0,0,0,.4),var(--glow);
  font-family:var(--serif);font-weight:700;color:#3a2c07;font-size:20px;letter-spacing:1px}
.seal.lg{width:74px;height:74px;font-size:26px}

/* countdown / timer units */
.count{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.count .u{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:14px;padding:12px 10px;min-width:74px;text-align:center}
.count .n{font-family:var(--serif);font-size:38px;font-weight:700;line-height:1;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.count .l{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
@media(max-width:520px){.count .u{min-width:58px}.count .n{font-size:28px}}

/* collage board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-radius:16px;overflow:hidden}
@media(max-width:560px){.board{gap:6px}}
.cell{position:relative;aspect-ratio:1;background:linear-gradient(160deg,#1b1b1f,#101012);border:1px solid var(--line-soft);
  display:grid;place-items:center;overflow:hidden;transition:.4s}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:reveal .8s ease both}
.cell .rn{font-family:var(--serif);font-size:22px;color:rgba(212,175,55,.5);font-weight:700}
.cell.locked .rn{color:rgba(212,175,55,.28)}
.cell.current{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold),0 0 18px rgba(212,175,55,.25);animation:pulse 2.2s ease infinite}
.cell.done{border-color:var(--line)}
.cell .ck{position:absolute;bottom:6px;right:6px;background:var(--gold);color:#1a1407;border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.cell .ck svg{width:12px;height:12px}
.cellclick{cursor:pointer}

.chapline{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.chapline:last-child{border-bottom:none}
.chapline .t{flex:1} .chapline .t b{font-family:var(--serif);font-size:20px;font-weight:600;display:block}
.chapline.locked{opacity:.5}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 20px}
.tab{padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;background:var(--panel);border:1px solid var(--line-soft);color:var(--ink-soft);transition:.2s}
.tab.active{background:var(--gold-grad);color:#1a1407;border-color:transparent}

.overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}
.modal{width:100%;max-width:560px;max-height:88dvh;overflow:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px}
.celebrate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;pointer-events:none;padding:20px}
.celebrate .msg{pointer-events:auto;text-align:center;max-width:520px;padding:34px;border-radius:24px;background:var(--panel-solid);border:1px solid var(--gold);box-shadow:var(--shadow),var(--glow)}

.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(420px,92vw)}
.toast{background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 15px;display:flex;gap:10px;align-items:flex-start;animation:slideDown .4s cubic-bezier(.2,.9,.3,1.2)}
.toast .t{font-weight:700;font-size:14px} .toast .b{font-size:13px;color:var(--ink-soft)}

.hearts{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;font-size:22px;animation:floatUp linear forwards;opacity:.9}
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:20px}
.lightbox img,.lightbox video{max-width:94vw;max-height:90dvh;border-radius:12px;box-shadow:var(--shadow)}
.mediaThumb{width:100%;border-radius:12px;border:1px solid var(--line);margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line-soft);font-size:14px}
.kv:last-child{border-bottom:none}
.empty{text-align:center;padding:44px 16px;color:var(--ink-soft)} .empty .e{font-size:40px;margin-bottom:8px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(212,175,55,.25);border-top-color:var(--gold);animation:spin .8s linear infinite;display:inline-block}
.loadscreen{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg)}
.fadein{animation:fadein .5s ease both} .pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.4) both}
.reward{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--gold-2);line-height:1.6}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes reveal{from{opacity:0;transform:scale(1.1);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes slideDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes floatUp{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.16)}45%{transform:scale(1)}60%{transform:scale(1.1)}}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 1px var(--gold),0 0 12px rgba(212,175,55,.15)}50%{box-shadow:inset 0 0 0 1px var(--gold),0 0 26px rgba(212,175,55,.4)}}
.beat{display:inline-block;animation:beat 1.8s ease infinite}
.shimmer{background:linear-gradient(90deg,rgba(212,175,55,.06) 25%,rgba(212,175,55,.18) 50%,rgba(212,175,55,.06) 75%);background-size:800px 100%;animation:sh 1.6s infinite}
@keyframes sh{0%{background-position:-400px 0}100%{background-position:400px 0}}
</style>
</head>
<body>
<div id="root"></div>
<div class="loadscreen" id="loadscreen">
  <div class="center">
    <div style="font-size:58px" class="beat">🖤</div>
    <div class="serif" style="font-size:26px;margin-top:10px;letter-spacing:1px">The Story of Us</div>
    <div class="muted" style="margin-top:6px">setting the scene…</div>
    <div style="margin-top:16px"><span class="spin"></span></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
/* ============ CONFIG ============ */
const SUPABASE_URL  = "https://rtqslyatkzwghnejzvjl.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0cXNseWF0a3p3Z2huZWp6dmpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNTAxOTYsImV4cCI6MjA5OTYyNjE5Nn0.pPxFM901AiomGlPTuQLYEZgOLVfQyNghvJfwguHq9iE";
const SONG_URL   = "song.mp3";                       // your song, sitting next to this file
const LOVE_START = "2025-04-01T02:13:00+05:30";       // when you started dating (IST)

if(typeof supabase==='undefined' || !supabase.createClient){
  document.getElementById('loadscreen').innerHTML='<div class="center" style="max-width:420px;padding:24px"><div style="font-size:48px">🌙</div><div class="serif" style="font-size:24px;margin-top:8px">Couldn’t load the library</div><div class="muted" style="margin-top:8px">Check your connection and refresh.</div></div>';
  throw new Error('supabase-js failed to load');
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth:{ storage: window.sessionStorage, storageKey:'sou-auth', persistSession:true, autoRefreshToken:true, detectSessionInUrl:false },
  realtime:{ params:{ eventsPerSecond:5 } }
});

/* ============ HELPERS ============ */
const $=(s,r=document)=>r.querySelector(s);
const el=id=>document.getElementById(id);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br=s=>esc(s).replace(/\n/g,"<br>");
const fmtDate=ts=>ts?new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
function roman(n){const m=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let r='';for(const[v,s]of m){while(n>=v){r+=s;n-=v;}}return r;}
const QUOTES=["Every love story is beautiful, but ours is my favourite.","I would find you in any lifetime.","You are my today and all of my tomorrows.","Whatever our souls are made of, yours and mine are the same.","Home is wherever you are."];

let state={ session:null, profile:null, role:null, view:'dash', activeRiddle:null,
  board:[], collage:{}, notifications:[], settings:null, timeline:[], music:false, channels:[], _celebrated:new Set() };

function toast(title,body,kind){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<div style="font-size:18px">${kind==='bad'?'🖤':kind==='ok'?'✨':'💌'}</div><div><div class="t">${esc(title)}</div>${body?`<div class="b">${esc(body)}</div>`:''}</div>`;
  el('toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='.4s';t.style.opacity='0';t.style.transform='translateY(-10px)';setTimeout(()=>t.remove(),400);},4400);
}
function floatHearts(n=18){const layer=document.createElement('div');layer.className='hearts';document.body.appendChild(layer);const em=['❤️','🖤','✨','🤍','💛'];for(let i=0;i<n;i++){const s=document.createElement('span');s.textContent=em[i%em.length];s.style.left=Math.random()*100+'vw';s.style.fontSize=(16+Math.random()*22)+'px';s.style.animationDuration=(3+Math.random()*3)+'s';s.style.animationDelay=(Math.random()*1.2)+'s';layer.appendChild(s);}setTimeout(()=>layer.remove(),7000);}
function burstConfetti(){try{const c=window.confetti;if(!c)return;const colors=['#D4AF37','#E8CE7A','#B8912E','#ffffff','#EDE7DA'];c({particleCount:120,spread:80,origin:{y:.6},colors});setTimeout(()=>c({particleCount:70,angle:60,spread:70,origin:{x:0},colors}),150);setTimeout(()=>c({particleCount:70,angle:120,spread:70,origin:{x:1},colors}),300);}catch(e){}}

/* ============ AUTH ============ */
async function loadProfile(){const{data}=await sb.from('profiles').select('*').eq('id',state.session.user.id).maybeSingle();state.profile=data;state.role=data?.role||'player';}
function renderLogin(msg){
  el('loadscreen').style.display='none';
  el('root').innerHTML=`<div class="app"><div class="wrap" style="display:grid;place-items:center;min-height:90dvh">
    <div class="card solid pop" style="max-width:420px;width:100%;text-align:center">
      <div class="eyebrow">A Private Invitation</div>
      <div style="font-size:46px;margin-top:10px" class="beat">🖤</div>
      <h1 style="font-size:36px;margin-top:6px">The Story of Us</h1>
      <p class="muted" style="margin:8px 0 18px">Twelve chapters. One picture. Ours.</p>
      <form id="loginForm" style="text-align:left">
        <label class="fld">Email</label><input class="input" id="email" type="email" autocomplete="username" required />
        <label class="fld">Password</label><input class="input" id="password" type="password" autocomplete="current-password" required />
        ${msg?`<div class="pill bad" style="margin-top:12px">${esc(msg)}</div>`:''}
        <button class="btn block" id="loginBtn" style="margin-top:18px" type="submit">Begin</button>
      </form>
    </div></div></div>`;
  $('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('#loginBtn');b.disabled=true;b.innerHTML='<span class="spin"></span>';const{error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){renderLogin(error.message);return;}boot();});
}
async function boot(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){renderLogin();return;}
  state.session=session; await loadProfile();
  if(!state.profile){renderLogin('No profile found for this account.');return;}
  el('loadscreen').style.display='none';
  await initData(); subscribeRealtime(); render(); startClock();
}

/* ============ DATA ============ */
async function initData(){
  const jobs=[loadNotifications(),loadSettings()];
  if(state.role==='player'){jobs.push(loadBoard(),loadCollage());}else{jobs.push(loadAdminData(),loadCollage());}
  await Promise.all(jobs);
}
async function loadBoard(){const{data}=await sb.rpc('get_player_board');state.board=(data||[]).slice().sort((a,b)=>a.day_number-b.day_number||a.riddle_number-b.riddle_number);}
async function loadCollage(){
  const{data}=await sb.from('media').select('riddle_id,path,created_at').eq('context','misc').order('created_at',{ascending:true});
  state.collage={};(data||[]).forEach(m=>{if(m.riddle_id)state.collage[m.riddle_id]=publicUrl('media',m.path);});
}
async function loadNotifications(){const{data}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(30);state.notifications=data||[];}
async function loadSettings(){const{data}=await sb.from('treasure_settings').select('*').maybeSingle();state.settings=data||null;}
async function loadTimeline(){const{data}=await sb.from('timeline_events').select('*').order('position');state.timeline=data||[];}
async function loadAdminData(){
  const[subs,prog,logs,days,riddles]=await Promise.all([
    sb.from('answer_submissions').select('*').order('created_at',{ascending:false}),
    sb.from('player_progress').select('*'),
    sb.from('activity_logs').select('*').order('created_at',{ascending:false}).limit(30),
    sb.from('days').select('*').order('day_number'),
    sb.from('riddles').select('*')
  ]);
  const rs=(riddles.data||[]).slice().sort((a,b)=>{const da=(days.data||[]).find(x=>x.id===a.day_id)?.day_number||0;const db=(days.data||[]).find(x=>x.id===b.day_id)?.day_number||0;return da-db||a.riddle_number-b.riddle_number;});
  state.admin={subs:subs.data||[],prog:prog.data||[],logs:logs.data||[],days:days.data||[],riddles:rs};
}
function publicUrl(bucket,path){const{data}=sb.storage.from(bucket).getPublicUrl(path);return data.publicUrl;}
function chapterNo(riddleId){const i=state.board.findIndex(r=>r.riddle_id===riddleId);return i>=0?i+1:0;}
function riddleSeq(){ // admin: ordered list with chapter numbers
  return (state.admin?.riddles||[]).map((r,i)=>({...r,chapter:i+1}));
}

/* ============ REALTIME ============ */
function subscribeRealtime(){
  state.channels.forEach(c=>sb.removeChannel(c));state.channels=[];
  const ch=sb.channel('rt-'+Math.random().toString(36).slice(2))
    .on('postgres_changes',{event:'*',schema:'public',table:'notifications'},onNotif)
    .on('postgres_changes',{event:'*',schema:'public',table:'player_progress'},()=>refresh())
    .on('postgres_changes',{event:'*',schema:'public',table:'answer_submissions'},()=>refresh())

}

/* ============ CLOCK ============ */
let clockInt=null;
function startClock(){if(clockInt)clearInterval(clockInt);clockInt=setInterval(tick,1000);}
function tick(){
  updateLoveTimer();let unlocked=false;
  document.querySelectorAll('[data-until]').forEach(node=>{
    const diff=+node.dataset.until-Date.now();
    if(diff<=0){unlocked=true;return;}
    const d=Math.floor(diff/864e5),h=Math.floor(diff%864e5/36e5),m=Math.floor(diff%36e5/6e4),s=Math.floor(diff%6e4/1e3);
    const set=(sel,v)=>{const x=node.querySelector(sel);if(x)x.textContent=String(v).padStart(2,'0');};
    const dd=node.querySelector('.dd');if(dd){if(d>0){dd.parentElement.style.display='';set('.dd',d);}else dd.parentElement.style.display='none';}
    set('.hh',h);set('.mm',m);set('.ss',s);
  });
  if(unlocked&&state.role==='player')loadBoard().then(render);
}
function loveParts(){const start=new Date(LOVE_START),now=new Date();let y=now.getFullYear()-start.getFullYear(),mo=now.getMonth()-start.getMonth(),d=now.getDate()-start.getDate(),h=now.getHours()-start.getHours(),mi=now.getMinutes()-start.getMinutes(),s=now.getSeconds()-start.getSeconds();if(s<0){s+=60;mi--;}if(mi<0){mi+=60;h--;}if(h<0){h+=24;d--;}if(d<0){d+=new Date(now.getFullYear(),now.getMonth(),0).getDate();mo--;}if(mo<0){mo+=12;y--;}return{y,mo,d,h,mi,s};}
function loveTimerCard(){return `<div class="card center">
  <div class="eyebrow">Together since 1 April 2025 · 2:13 AM</div>
  <div id="loveTimer" class="count" style="margin-top:12px"></div>
  <div class="muted" style="font-size:12.5px">and counting, forever 🖤</div></div>`;}
function updateLoveTimer(){const box=el('loveTimer');if(!box)return;const p=loveParts();const u=(n,l)=>`<div class="u"><div class="n">${n}</div><div class="l">${l}</div></div>`;const pad=n=>String(n).padStart(2,'0');box.innerHTML=u(p.y,'Yr')+u(p.mo,'Mo')+u(p.d,'Day')+u(pad(p.h),'Hr')+u(pad(p.mi),'Min')+u(pad(p.s),'Sec');}

async function submitChapter(riddleId,text,file,btn){
  try{
    const uid=state.session.user.id;
    const safe=file.name.replace(/[^\w.\-]/g,'_');
    const path=`collage/${uid}/${riddleId}_${Date.now()}_${safe}`;
    const up=await sb.storage.from('media').upload(path,file);
    if(up.error){toast('Photo upload failed',up.error.message,'bad');resetBtn(btn,'Add my piece');return;}
    const mt=file.type.startsWith('video')?'video':'image';
    await sb.from('media').insert({context:'misc',riddle_id:riddleId,bucket:'media',path,media_type:mt,uploaded_by:uid});
    const{error}=await sb.rpc('submit_answer',{_riddle:riddleId,_answer:text});
    if(error){toast('Could not submit',error.message,'bad');resetBtn(btn,'Add my piece');return;}
    toast('Sent 💌','Waiting for him to add your piece.');await Promise.all([loadBoard(),loadCollage()]);render();
  }catch(e){toast('Something went wrong',e.message,'bad');resetBtn(btn,'Add my piece');}
}

      <div class="grid g3" style="margin-top:12px">${list.map(r=>`<div class="card" style="padding:14px;background:rgba(0,0,0,.25)">
        <div class="row" style="justify-content:space-between"><span class="pill info">Ch ${roman(r.chapter)}</span></div>
        <div class="serif" style="font-size:18px;margin:6px 0 2px">${esc(r.title)}</div>
        <div class="muted" style="font-size:12px">🔓 ${fmtDate(r.unlock_at)}</div>
        <div class="row" style="gap:6px;margin-top:10px"><button class="btn sm ghost" data-editriddle="${r.id}">Edit</button></div></div>`).join('')}</div></div>`;}).join('')}`;
}
function adminEditor(){
  const r=state.editRiddle;
  return `<button class="tab" data-nav="content" style="margin-bottom:14px">← Back</button>
  <h1 style="font-size:30px;margin-bottom:12px">Edit chapter</h1>
  <div class="card" style="max-width:700px">
    <label class="fld">Unlocks at</label><input class="input" id="e_unlock" type="datetime-local" value="${toLocalInput(r.unlock_at)}">
    <label class="fld">Title</label><input class="input" id="e_title" value="${esc(r.title||'')}">
    <label class="fld">Mission (the intro)</label><textarea class="input" id="e_story">${esc(r.story||'')}</textarea>
    <label class="fld">Challenge (what she does)</label><textarea class="input" id="e_question">${esc(r.question||'')}</textarea>
    <label class="fld">Hidden message (revealed after she completes it)</label><textarea class="input" id="e_notes">${esc(r.special_notes||'')}</textarea>
    <label class="fld">Note to yourself / what to approve</label><input class="input" id="e_answer" value="${esc(r.correct_answer||'')}">
    <button class="btn block" id="saveRiddle" style="margin-top:16px">Save chapter</button>
  </div>`;
}
function toLocalInput(ts){if(!ts)return'';const d=new Date(ts),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function adminTreasure(){const s=state.settings||{};return `<h1 style="font-size:30px;margin-bottom:12px">The Finale</h1>
  <div class="card" style="max-width:700px">
    <label class="fld">Title</label><input class="input" id="t_title" value="${esc(s.title||'')}">
    <label class="fld">Message</label><textarea class="input" id="t_msg">${esc(s.message||'')}</textarea>
    <label class="fld">Letter (incl. the 13th-piece message)</label><textarea class="input" id="t_letter" style="min-height:180px">${esc(s.letter||'')}</textarea>
    <label class="fld">And then… (the reveal)</label><textarea class="input" id="t_loc">${esc(s.location_reveal||'')}</textarea>
    <button class="btn" id="saveTreasure" style="margin-top:14px">Save finale</button>
  </div>`;}
function adminExtras(){return `<h1 style="font-size:30px;margin-bottom:12px">Extras</h1>
  <div class="grid g2">
    <div class="card"><h3 style="font-size:20px">Her welcome</h3>
      <label class="fld">Her display name</label><input class="input" id="p_name" value="${esc(getPP()?.display_name||'')}">
      <button class="btn sm" id="p_save" style="margin-top:12px">Save</button></div>
    <div class="card"><h3 style="font-size:20px">Add a timeline moment</h3>
      <label class="fld">Date</label><input class="input" type="date" id="tl_date">
      <label class="fld">Title</label><input class="input" id="tl_title">
      <label class="fld">Description</label><textarea class="input" id="tl_desc"></textarea>
      <button class="btn sm" id="tl_save" style="margin-top:10px">Add</button></div>
  </div>`;}
function getPP(){return state._pp||null;}
async function loadPP(){const{data}=await sb.from('profiles').select('*').eq('role','player').maybeSingle();state._pp=data||null;}

async function wireAdmin(){
  document.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click',()=>reviewSubmission(b.dataset.approve,true,$(`.fb[data-fb="${b.dataset.approve}"]`)?.value)));
  document.querySelectorAll('[data-reject]').forEach(b=>b.addEventListener('click',()=>reviewSubmission(b.dataset.reject,false,$(`.fb[data-fb="${b.dataset.reject}"]`)?.value)));
  document.querySelectorAll('[data-editriddle]').forEach(b=>b.addEventListener('click',()=>{state.editRiddle={...(state.admin.riddles||[]).find(r=>r.id===b.dataset.editriddle)};state.view='riddle';render();}));
  const sr=$('#saveRiddle');if(sr)sr.addEventListener('click',saveRiddle);
  const st=$('#saveTreasure');if(st)st.addEventListener('click',async()=>{const patch={title:$('#t_title').value,message:$('#t_msg').value,letter:$('#t_letter').value,location_reveal:$('#t_loc').value,updated_at:new Date().toISOString()};const{error}=await sb.from('treasure_settings').update(patch).eq('id',true);if(error)return toast('Failed',error.message,'bad');toast('Finale saved ✨');await loadSettings();});
  const ps=$('#p_save');if(ps)ps.addEventListener('click',async()=>{const pp=getPP();if(!pp)return;const{error}=await sb.from('profiles').update({display_name:$('#p_name').value}).eq('id',pp.id);if(error)return toast('Failed',error.message,'bad');toast('Saved');await loadPP();});
  const tl=$('#tl_save');if(tl)tl.addEventListener('click',async()=>{if(!$('#tl_title').value||!$('#tl_date').value)return toast('Missing','Date and title required','bad');const{error}=await sb.from('timeline_events').insert({event_date:$('#tl_date').value,title:$('#tl_title').value,description:$('#tl_desc').value||null});if(error)return toast('Failed',error.message,'bad');toast('Added 📖');$('#tl_title').value='';$('#tl_desc').value='';});
  document.querySelectorAll('.lb').forEach(n=>n.addEventListener('click',()=>lightbox(n.dataset.lb)));
}
async function saveRiddle(){
  const b=$('#saveRiddle');b.disabled=true;b.innerHTML='<span class="spin"></span>';
  const payload={title:$('#e_title').value,story:$('#e_story').value,question:$('#e_question').value,special_notes:$('#e_notes').value||null,correct_answer:$('#e_answer').value,unlock_at:new Date($('#e_unlock').value).toISOString()};
  const{error}=await sb.from('riddles').update(payload).eq('id',state.editRiddle.id);
  if(error){toast('Failed',error.message,'bad');b.disabled=false;b.textContent='Save chapter';return;}
  toast('Saved ✨');await loadAdminData();state.view='content';render();
}

/* ============ GLOBAL WIRING ============ */
function wireGlobal(){
  document.querySelectorAll('[data-nav]').forEach(n=>n.addEventListener('click',()=>navigate(n.dataset.nav)));
  document.querySelectorAll('[data-act]').forEach(n=>n.addEventListener('click',()=>topAct(n.dataset.act)));
}
async function navigate(v){
  if(v==='timeline'){await goTimeline();return;}
  if(v==='treasure'){if(state.role==='player'){await goTreasure();return;}}
  if(v==='extras'){await loadPP();}
  if(v==='content')state.editRiddle=null;
  state.view=v;state.activeRiddle=null;render();
}
function topAct(a){if(a==='logout')sb.auth.signOut().then(()=>location.reload());else if(a==='notif')openNotif();else if(a==='music')toggleMusic();else if(a==='fullscreen')toggleFullscreen();}
function paintNotif(){const btn=document.querySelector('[data-act="notif"]');if(!btn)return;const b=btn.querySelector('.badge');const u=state.notifications.filter(n=>!n.read).length;if(u){if(b)b.textContent=u;else{const s=document.createElement('span');s.className='badge';s.textContent=u;btn.appendChild(s);}}else if(b)b.remove();}
async function openNotif(){
  const items=state.notifications;const wrap=document.createElement('div');wrap.className='overlay';
  wrap.innerHTML=`<div class="modal pop"><div class="row" style="justify-content:space-between"><h2 style="font-size:26px">Notifications</h2><button class="btn ghost sm" id="mk">Mark read</button></div>
    <div style="margin-top:12px">${items.length?items.map(n=>`<div class="card" style="margin-bottom:8px;${n.read?'opacity:.55':''}"><div class="row" style="justify-content:space-between"><b>${esc(n.title)}</b><span class="muted" style="font-size:12px">${fmtDate(n.created_at)}</span></div>${n.body?`<div class="muted" style="font-size:14px">${esc(n.body)}</div>`:''}</div>`).join(''):'<div class="empty"><div class="e">🔔</div>Nothing yet.</div>'}</div>
    <button class="btn ghost block" id="cl" style="margin-top:6px">Close</button></div>`;
  document.body.appendChild(wrap);wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove();});
  $('#cl').addEventListener('click',()=>wrap.remove());
  const ids=items.filter(n=>!n.read).map(n=>n.id);
  $('#mk').addEventListener('click',async()=>{if(ids.length){await sb.rpc('mark_notifications_read',{_ids:ids});await loadNotifications();paintNotif();}wrap.remove();});
  if(ids.length){await sb.rpc('mark_notifications_read',{_ids:ids});await loadNotifications();paintNotif();}
}
let audio=null;
function toggleMusic(){state.music=!state.music;if(state.music){if(!SONG_URL){toast('No song set');state.music=false;render();return;}if(!audio){audio=new Audio(SONG_URL);audio.loop=true;audio.volume=.55;}audio.play().catch(()=>toast('Tap again','Tap the note once more to start audio.'));}else if(audio)audio.pause();render();}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
function lightbox(url){const wrap=document.createElement('div');wrap.className='lightbox';wrap.innerHTML=/\.(mp4|mov|webm|m4v)/i.test(url)?`<video controls autoplay src="${url}"></video>`:`<img src="${url}">`;wrap.addEventListener('click',()=>wrap.remove());document.body.appendChild(wrap);}

/* ============ START ============ */
sb.auth.onAuthStateChange(()=>{});
boot().catch(e=>{console.error(e);renderLogin('Could not connect. Check your internet and refresh.');});
</script>
</body>
</html>
