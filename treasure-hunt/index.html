<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7d9e3" />
<title>Treasure Hunt ❤️</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
/* ============ THEME ============ */
:root{
  --pink-50:#fff5f8; --pink-100:#ffe9f0; --pink-200:#ffd6e4; --pink-300:#f9b8cf;
  --rose:#e28aa6; --rose-deep:#c8607f; --gold:#c9a24b; --gold-soft:#e7cf9b;
  --cream:#fbf7f2; --ink:#3a2b32; --ink-soft:#6b5a61; --white:#ffffff;
  --bg:#fff7fa; --bg2:#fdeef4; --card:rgba(255,255,255,.72); --card-solid:#fff;
  --border:rgba(200,96,127,.16); --shadow:0 20px 60px -24px rgba(150,60,90,.35);
  --shadow-sm:0 8px 24px -12px rgba(150,60,90,.28);
  --radius:22px; --radius-sm:14px; --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --grad:linear-gradient(135deg,#f9b8cf 0%,#e7cf9b 100%);
  --grad-deep:linear-gradient(135deg,#c8607f 0%,#c9a24b 120%);
}
html[data-theme="dark"]{
  --pink-50:#241820; --pink-100:#2c1d26; --pink-200:#3a2632; --pink-300:#5a3a48;
  --rose:#e28aa6; --rose-deep:#f2a7c0; --cream:#1c1419; --ink:#f4e8ee; --ink-soft:#c3a9b5;
  --white:#241820; --bg:#160f14; --bg2:#1e141b; --card:rgba(42,28,37,.66); --card-solid:#241820;
  --border:rgba(242,167,192,.16); --shadow:0 24px 70px -28px rgba(0,0,0,.7);
  --shadow-sm:0 10px 30px -16px rgba(0,0,0,.6);
  --grad:linear-gradient(135deg,#7d4a60 0%,#8a6f3a 100%);
  --grad-deep:linear-gradient(135deg,#f2a7c0 0%,#e7cf9b 120%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  background-image:radial-gradient(1200px 600px at 10% -10%,var(--pink-200),transparent 60%),
    radial-gradient(1000px 700px at 110% 10%,var(--bg2),transparent 55%),
    radial-gradient(900px 900px at 50% 120%,var(--pink-100),transparent 60%);
  background-attachment:fixed; -webkit-font-smoothing:antialiased; line-height:1.55;
  overflow-x:hidden; transition:background .5s,color .4s;
}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:.2px;line-height:1.1}
.muted{color:var(--ink-soft)}
.center{text-align:center}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px}
a{color:var(--rose-deep);text-decoration:none}
::selection{background:var(--pink-300);color:#3a2b32}

/* ============ LAYOUT ============ */
.app{min-height:100dvh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:20px 18px 96px;flex:1}
.topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.15));
  border-bottom:1px solid var(--border)}
html[data-theme="dark"] .topbar{background:linear-gradient(180deg,rgba(30,20,27,.6),rgba(30,20,27,.2))}
.topbar-in{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--serif);font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--grad-deep);box-shadow:0 0 14px var(--rose)}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);
  border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:.2s;position:relative}
.iconbtn:hover{transform:translateY(-2px)}
.iconbtn svg{width:19px;height:19px}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--rose-deep);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

/* ============ CARDS ============ */
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.card.solid{background:var(--card-solid)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;gap:12px;align-items:center}
.wrap-flex{flex-wrap:wrap}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;
  font-weight:600;font-size:14.5px;background:var(--grad-deep);color:#fff;box-shadow:var(--shadow-sm);
  transition:transform .15s,box-shadow .2s,opacity .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--border)}
.btn.soft{background:var(--pink-100);color:var(--rose-deep)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#4a3a10}
.btn.danger{background:linear-gradient(135deg,#e06a6a,#d88)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.block{width:100%}

/* ============ FORMS ============ */
label.fld{display:block;margin:12px 0 6px;font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px}
.input,textarea.input,select.input{width:100%;padding:13px 15px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--white);color:var(--ink);outline:none;transition:.2s;box-shadow:inset 0 1px 2px rgba(0,0,0,.02)}
.input:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(226,138,166,.16)}
textarea.input{min-height:96px;resize:vertical;line-height:1.6}

/* ============ PILLS / TAGS ============ */
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600}
.pill.wait{background:#fff3d6;color:#9a7a1e}
.pill.ok{background:#e0f5e6;color:#2f8a52}
.pill.bad{background:#ffe1e1;color:#c0483f}
.pill.info{background:var(--pink-100);color:var(--rose-deep)}
html[data-theme="dark"] .pill.wait{background:#4a3c17;color:#f0d488}
html[data-theme="dark"] .pill.ok{background:#1f4630;color:#8ee0a8}
html[data-theme="dark"] .pill.bad{background:#4d2320;color:#f2a49c}

/* ============ COUNTDOWN ============ */
.count{display:flex;gap:14px;justify-content:center;margin:8px 0}
.count .u{background:var(--card-solid);border:1px solid var(--border);border-radius:18px;padding:14px 8px;min-width:78px;text-align:center;box-shadow:var(--shadow-sm)}
.count .n{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1;background:var(--grad-deep);-webkit-background-clip:text;background-clip:text;color:transparent}
.count .l{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
@media(max-width:520px){.count .u{min-width:64px}.count .n{font-size:32px}}

/* ============ RIDDLE TILES ============ */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.tiles{grid-template-columns:repeat(3,1fr);gap:9px}}
.tile{position:relative;aspect-ratio:1;border-radius:20px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;
  border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow-sm);transition:.22s;overflow:hidden;cursor:pointer}
.tile:hover{transform:translateY(-3px)}
.tile.locked{opacity:.62;cursor:not-allowed}
.tile.done{background:linear-gradient(160deg,rgba(201,162,75,.16),rgba(226,138,166,.1))}
.tile .num{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--rose-deep)}
.tile .st{font-size:11px;font-weight:600}
.tile .ic{position:absolute;top:10px;right:10px;opacity:.7}
.tile .ic svg{width:16px;height:16px}
.tile.done .num{color:var(--gold)}

/* ============ PROGRESS RING ============ */
.ring{--p:0;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--rose-deep) calc(var(--p)*1%),var(--pink-200) 0);position:relative}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card-solid)}
.ring .v{position:relative;z-index:1;text-align:center}
.ring .v b{font-family:var(--serif);font-size:30px;display:block;line-height:1}

/* ============ OVERLAYS ============ */
.overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(60,30,45,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.modal{width:100%;max-width:560px;max-height:88dvh;overflow:auto;background:var(--card-solid);border:1px solid var(--border);
  border-radius:26px;box-shadow:var(--shadow);padding:26px}
.celebrate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;pointer-events:none}
.celebrate .msg{pointer-events:auto;text-align:center;max-width:520px;padding:34px;border-radius:28px;
  background:var(--card-solid);border:1px solid var(--border);box-shadow:var(--shadow)}

/* toast */
.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(420px,92vw)}
.toast{background:var(--card-solid);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:12px 16px;
  display:flex;gap:10px;align-items:flex-start;animation:slideDown .4s cubic-bezier(.2,.9,.3,1.2)}
.toast .t{font-weight:700;font-size:14px}
.toast .b{font-size:13px;color:var(--ink-soft)}

/* hearts float */
.hearts{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;font-size:22px;animation:floatUp linear forwards;opacity:.9}

/* nav */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.tab{padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--ink-soft);transition:.2s}
.tab.active{background:var(--grad-deep);color:#fff;border-color:transparent}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(20,10,15,.86);display:grid;place-items:center;padding:20px}
.lightbox img,.lightbox video{max-width:94vw;max-height:90dvh;border-radius:16px;box-shadow:var(--shadow)}

/* misc */
.divider{height:1px;background:var(--border);margin:16px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:14px}
.kv:last-child{border-bottom:none}
.mediaThumb{width:100%;border-radius:14px;border:1px solid var(--border);margin-top:8px}
.empty{text-align:center;padding:40px 16px;color:var(--ink-soft)}
.empty .e{font-size:40px;margin-bottom:8px}
.fadein{animation:fadein .5s ease both}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.4) both}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--pink-200);border-top-color:var(--rose-deep);animation:spin .8s linear infinite;display:inline-block}
.loadscreen{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes slideDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes floatUp{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}45%{transform:scale(1)}60%{transform:scale(1.12)}}
.beat{display:inline-block;animation:beat 1.6s ease infinite}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,var(--pink-100) 25%,var(--pink-200) 50%,var(--pink-100) 75%);background-size:800px 100%;animation:shimmer 1.6s infinite}
</style>
</head>
<body>
<div id="root"></div>

<div class="loadscreen" id="loadscreen">
  <div class="center">
    <div style="font-size:64px" class="beat">❤️</div>
    <div class="serif" style="font-size:26px;margin-top:10px">Treasure Hunt</div>
    <div class="muted" style="margin-top:6px">preparing something lovely…</div>
    <div style="margin-top:16px"><span class="spin"></span></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
/* ============================================================
   CONFIG — this single file is already wired to your live
   Supabase project. Nothing else to set up.
   ============================================================ */
const SUPABASE_URL  = "https://rtqslyatkzwghnejzvjl.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0cXNseWF0a3p3Z2huZWp6dmpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNTAxOTYsImV4cCI6MjA5OTYyNjE5Nn0.pPxFM901AiomGlPTuQLYEZgOLVfQyNghvJfwguHq9iE";
// Apply saved theme before anything paints
(function(){ document.documentElement.dataset.theme = localStorage.getItem('th-theme')||'light'; })();
if(typeof supabase==='undefined' || !supabase.createClient){
  document.getElementById('loadscreen').innerHTML =
    '<div class="center" style="max-width:420px;padding:24px"><div style="font-size:48px">🌙</div>'+
    '<div class="serif" style="font-size:24px;margin-top:8px">Couldn’t load the library</div>'+
    '<div class="muted" style="margin-top:8px">Please check your internet connection and refresh. '+
    'The app needs to reach the Supabase and jsDelivr networks.</div></div>';
  throw new Error('supabase-js failed to load');
}
// Per-TAB auth storage: lets you keep Admin open in one tab and Player in another
// (e.g. for testing) without the two logins overwriting each other. On real
// separate devices this behaves exactly like normal "stay logged in for this session".
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth:{ storage: window.sessionStorage, storageKey:'th-auth', persistSession:true, autoRefreshToken:true, detectSessionInUrl:false },
  realtime:{ params:{ eventsPerSecond:5 } }
});

// Background music — your song. Set to the uploaded MP3's public URL.
const SONG_URL = "";

/* ============================================================
   SMALL HELPERS
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const el = id=>document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br = s => esc(s).replace(/\n/g,"<br>");
const fmtDate = ts => ts? new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
const ROMANTIC_QUOTES = [
  "In all the world, there is no heart for me like yours.",
  "You are, and always have been, my dream.",
  "I have waited a lifetime to find you — and you were worth every second.",
  "Every love story is beautiful, but ours is my favourite.",
  "You are my today and all of my tomorrows.",
  "Whatever our souls are made of, yours and mine are the same.",
  "I would find you in any lifetime.",
  "Home is wherever you are."
];

let state = {
  session:null, profile:null, role:null,
  view:'dash', activeRiddle:null,
  board:[], notifications:[], settings:null,
  progressMap:{}, achievements:[], playerAch:[],
  music:false, seenComplete:new Set(), channels:[]
};

function toast(title, body, kind){
  const wrap = el('toasts'); const t=document.createElement('div'); t.className='toast';
  t.innerHTML = `<div style="font-size:18px">${kind==='bad'?'💔':kind==='ok'?'✨':'💌'}</div>
    <div><div class="t">${esc(title)}</div>${body?`<div class="b">${esc(body)}</div>`:''}</div>`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.transition='.4s'; t.style.opacity='0'; t.style.transform='translateY(-10px)'; setTimeout(()=>t.remove(),400); }, 4200);
}
function floatHearts(n=18){
  const layer=document.createElement('div'); layer.className='hearts'; document.body.appendChild(layer);
  const em=['❤️','💗','💖','🌹','✨','💕'];
  for(let i=0;i<n;i++){ const s=document.createElement('span'); s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+'vw'; s.style.fontSize=(16+Math.random()*22)+'px';
    s.style.animationDuration=(3+Math.random()*3)+'s'; s.style.animationDelay=(Math.random()*1.2)+'s'; layer.appendChild(s); }
  setTimeout(()=>layer.remove(),7000);
}
function burstConfetti(){
  try{
    const c=window.confetti; if(!c) return;
    const colors=['#e28aa6','#c9a24b','#f9b8cf','#ffffff','#c8607f'];
    c({particleCount:120,spread:80,origin:{y:.6},colors});
    setTimeout(()=>c({particleCount:80,angle:60,spread:70,origin:{x:0},colors}),150);
    setTimeout(()=>c({particleCount:80,angle:120,spread:70,origin:{x:1},colors}),300);
  }catch(e){}
}

/* ============================================================
   AUTH
   ============================================================ */
async function loadProfile(){
  const { data } = await sb.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
  state.profile = data; state.role = data?.role || 'player';
}
function renderLogin(msg){
  el('loadscreen').style.display='none';
  el('root').innerHTML = `
  <div class="app"><div class="wrap" style="display:grid;place-items:center;min-height:90dvh">
    <div class="card solid pop" style="max-width:420px;width:100%;text-align:center">
      <div style="font-size:52px" class="beat">❤️</div>
      <h1 style="font-size:34px;margin-top:8px">Treasure Hunt</h1>
      <p class="muted" style="margin:6px 0 18px">A little love story, unlocked one clue at a time.</p>
      <form id="loginForm" style="text-align:left">
        <label class="fld">Email</label>
        <input class="input" id="email" type="email" autocomplete="username" placeholder="you@treasure.love" required />
        <label class="fld">Password</label>
        <input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        ${msg?`<div class="pill bad" style="margin-top:12px">${esc(msg)}</div>`:''}
        <button class="btn block" id="loginBtn" style="margin-top:18px" type="submit">Enter our story</button>
      </form>
      <p class="muted" style="font-size:12px;margin-top:16px">Two hearts only. Ask your keeper for the key.</p>
    </div>
  </div></div>`;
  $('#loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const b=$('#loginBtn'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
    const { error } = await sb.auth.signInWithPassword({ email:$('#email').value.trim(), password:$('#password').value });
    if(error){ renderLogin(error.message); return; }
    boot();
  });
}

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ renderLogin(); return; }
  state.session = session;
  await loadProfile();
  if(!state.profile){ renderLogin('No profile found for this account.'); return; }
  el('loadscreen').style.display='none';
  applyTheme();
  await initData();
  subscribeRealtime();
  render();
  startClock();
}

/* ============================================================
   DATA LOADERS
   ============================================================ */
async function initData(){
  const jobs=[loadNotifications(), loadSettings()];
  if(state.role==='player'){ jobs.push(loadBoard(), loadAchievements()); }
  else { jobs.push(loadAdminData()); }
  await Promise.all(jobs);
}
async function loadBoard(){
  const { data } = await sb.rpc('get_player_board');
  state.board = data||[];
  // detect newly completed for celebration
  state.board.forEach(r=>{ if(r.status==='completed') state.seenComplete.add(r.riddle_id); });
}
async function loadNotifications(){
  const { data } = await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(30);
  state.notifications = data||[];
}
async function loadSettings(){
  const { data } = await sb.from('treasure_settings').select('*').maybeSingle();
  state.settings = data||null;
}
async function loadAchievements(){
  const [a,b] = await Promise.all([
    sb.from('achievements').select('*').order('sort'),
    sb.from('player_achievements').select('*')
  ]);
  state.achievements=a.data||[]; state.playerAch=(b.data||[]).map(x=>x.achievement_code);
}
async function loadAdminData(){
  const [subs,pun,proofs,prog,logs,days,riddles] = await Promise.all([
    sb.from('answer_submissions').select('*').order('created_at',{ascending:false}),
    sb.from('punishments').select('*').order('created_at',{ascending:false}),
    sb.from('punishment_proofs').select('*').order('created_at',{ascending:false}),
    sb.from('player_progress').select('*'),

/* ============================================================
   CLOCK (countdowns)
   ============================================================ */
let clockInt=null;
function startClock(){ if(clockInt) clearInterval(clockInt); clockInt=setInterval(tickClocks,1000); }
function tickClocks(){
  let unlockedSomething=false;
  document.querySelectorAll('[data-until]').forEach(node=>{
    const target=+node.dataset.until; const diff=target-Date.now();
    if(diff<=0){ node.dataset.done='1'; unlockedSomething=true; return; }
    const d=Math.floor(diff/864e5), h=Math.floor(diff%864e5/36e5), m=Math.floor(diff%36e5/6e4), s=Math.floor(diff%6e4/1e3);
    const set=(sel,v)=>{ const x=node.querySelector(sel); if(x) x.textContent=String(v).padStart(2,'0'); };
    const dd=node.querySelector('.dd');
    if(dd){ if(d>0){ dd.parentElement.style.display=''; set('.dd',d);} else { dd.parentElement.style.display='none'; } }
    set('.hh',h); set('.mm',m); set('.ss',s);
  });
  if(unlockedSomething){ // a timer hit zero -> reload board so it unlocks
    if(state.role==='player'){ loadBoard().then(render); }
  }
}

  return `<img class="mediaThumb lb" data-lb="${url}" src="${url}" alt="">${cap}`;

   ============================================================ */
function wirePlayer(){
  document.querySelectorAll('[data-riddle]').forEach(n=>n.addEventListener('click',()=>openRiddle(n.dataset.riddle)));
  const ansBtn=$('#ansBtn');
  if(ansBtn) ansBtn.addEventListener('click', async ()=>{
    const v=$('#ansInput').value.trim(); if(!v){ toast('Empty','Write your answer first','bad'); return; }
    ansBtn.disabled=true; ansBtn.innerHTML='<span class="spin"></span>';
    await submitAnswer(state.activeRiddle.board.riddle_id, v);
  });
  // proof type switch
  let ptype='text';
  document.querySelectorAll('[data-ptype]').forEach(b=>b.addEventListener('click',()=>{
    ptype=b.dataset.ptype;
    document.querySelectorAll('[data-ptype]').forEach(x=>x.classList.toggle('active',x===b));
    $('#proofText').style.display= ptype==='text'?'':'none';
    $('#proofFile').style.display= ptype==='text'?'none':'';
  }));
  const pf=$('#proofFileInput');
  if(pf) pf.addEventListener('change',()=>{
    const f=pf.files[0]; if(!f) return;
    const url=URL.createObjectURL(f);
    $('#proofPreview').innerHTML = f.type.startsWith('video')?`<video class="mediaThumb" controls src="${url}"></video>`:`<img class="mediaThumb" src="${url}">`;
  });
  const proofBtn=$('#proofBtn');
  if(proofBtn) proofBtn.addEventListener('click', async ()=>{
    const punId=proofBtn.dataset.pun;
    proofBtn.disabled=true; proofBtn.innerHTML='<span class="spin"></span>';
    try{
      if(ptype==='text'){
        const t=$('#proofTextInput').value.trim(); if(!t){ toast('Empty','Write something','bad'); proofBtn.disabled=false; proofBtn.textContent='Send proof'; return; }
        await submitProof(punId,'text',t);
      } else {
        const f=$('#proofFileInput').files[0]; if(!f){ toast('No file','Choose a file','bad'); proofBtn.disabled=false; proofBtn.textContent='Send proof'; return; }
        const path=`${state.session.user.id}/${Date.now()}_${f.name.replace(/[^\w.\-]/g,'_')}`;
        const up=await sb.storage.from('proofs').upload(path,f,{upsert:false});
        if(up.error){ toast('Upload failed',up.error.message,'bad'); proofBtn.disabled=false; proofBtn.textContent='Send proof'; return; }
        await submitProof(punId, ptype, null, 'proofs', path);
      }
    }catch(e){ toast('Failed', e.message,'bad'); }
  });
  const noteBtn=$('#noteBtn');
  if(noteBtn) noteBtn.addEventListener('click', async ()=>{
    const b=$('#noteInput').value.trim(); if(!b) return;
    const { error }=await sb.from('secret_notes').insert({ author_id:state.session.user.id, body:b });
    if(error) return toast('Failed',error.message,'bad');
    toast('Note sent 💌'); await loadExtras(); render();
  });
  document.querySelectorAll('.lb').forEach(n=>n.addEventListener('click',()=>lightbox(n.dataset.lb)));
}

function celebrate(r){
  state._celebrated=state._celebrated||new Set(); state._celebrated.add(r.riddle_id);
  burstConfetti(); floatHearts(24);
  const q=pickQuote(r.riddle_id);
  const wrap=document.createElement('div'); wrap.className='celebrate';
  wrap.innerHTML=`<div class="msg pop"><div style="font-size:52px" class="beat">💖</div>
    <h2 style="font-size:30px">Riddle solved</h2>
    <p class="serif" style="font-size:21px;color:var(--rose-deep);margin:8px 0 16px">"${esc(q)}"</p>

  document.body.appendChild(wrap);

}

  }));

  const eMedia=$('#e_media'); if(eMedia) eMedia.addEventListener('change', uploadRiddleMedia);
  if(state.view==='riddle' && state.editRiddle?.id) loadRiddleMediaList();

async function addDayFlow(){
  const days=state.admin.days||[]; const n=days.length+1;
  const title=prompt('Day title', 'Day '+['One','Two','Three','Four','Five','Six'][n-1]||('Day '+n)); if(title==null) return;
  const date=prompt('Date (YYYY-MM-DD)', new Date(Date.now()+(n-1)*864e5).toISOString().slice(0,10)); if(!date) return;
  const { error }=await sb.from('days').insert({ day_number:n, title, date });
  if(error) return toast('Failed',error.message,'bad'); toast('Day added'); await loadAdminData(); render();
}
async function saveRiddle(){
  const b=$('#saveRiddle'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
  const payload={
    day_id:state.editRiddle.day_id,
    riddle_number:+$('#e_num').value, title:$('#e_title').value, story:$('#e_story').value,
    question:$('#e_question').value, correct_answer:$('#e_answer').value, hint:$('#e_hint').value||null,
    location_hint:$('#e_loc').value||null, special_notes:$('#e_notes').value||null,
    unlock_at:new Date($('#e_unlock').value).toISOString()
  };
  let res;
  if(state.editRiddle.id) res=await sb.from('riddles').update(payload).eq('id',state.editRiddle.id);
  else res=await sb.from('riddles').insert(payload);
  if(res.error){ toast('Failed',res.error.message,'bad'); b.disabled=false; b.textContent='Save'; return; }
  toast('Saved ✨'); await loadAdminData(); state.view='content'; render();
}
async function loadRiddleMediaList(){
  if(!state.editRiddle?.id) return;
  const { data }=await sb.from('media').select('*').eq('riddle_id',state.editRiddle.id).order('position');
  const box=$('#e_medialist'); if(!box) return;
  box.innerHTML=(data||[]).map(m=>`<div class="row" style="justify-content:space-between;gap:8px;margin:6px 0">
    <span class="muted" style="font-size:13px">${esc(m.media_type)} · ${esc(m.path.split('/').pop())}</span>
    <button class="btn sm danger" data-delmedia="${m.id}">✕</button></div>`).join('')||'<span class="muted" style="font-size:13px">No media yet.</span>';
  box.querySelectorAll('[data-delmedia]').forEach(x=>x.addEventListener('click',async ()=>{
    await sb.from('media').delete().eq('id',x.dataset.delmedia); loadRiddleMediaList();
  }));
}
async function uploadRiddleMedia(e){
  const f=e.target.files[0]; if(!f) return;
  if(!state.editRiddle?.id){ toast('Save first','Create the riddle before adding media.','bad'); return; }
  const mt = f.type.startsWith('video')?'video':f.type.startsWith('audio')?'audio':f.type==='application/pdf'?'pdf':'image';
  const path=`riddle/${state.editRiddle.id}/${Date.now()}_${f.name.replace(/[^\w.\-]/g,'_')}`;
  const up=await sb.storage.from('media').upload(path,f);
  if(up.error) return toast('Upload failed',up.error.message,'bad');
  const { error }=await sb.from('media').insert({ context:'riddle', riddle_id:state.editRiddle.id, bucket:'media', path, media_type:mt, uploaded_by:state.session.user.id });
  if(error) return toast('Failed',error.message,'bad');
  toast('Media added'); loadRiddleMediaList(); e.target.value='';
}
function wireAdminExtras(){
  const ms=$('#m_save'); if(ms) ms.addEventListener('click', async ()=>{
    const f=$('#m_file').files[0]; if(!f) return toast('No file','Choose a photo','bad');
    const mt=f.type.startsWith('video')?'video':'image';
    const path=`memory/${Date.now()}_${f.name.replace(/[^\w.\-]/g,'_')}`;
    const up=await sb.storage.from('media').upload(path,f); if(up.error) return toast('Upload failed',up.error.message,'bad');
    const { error }=await sb.from('memories').insert({ title:$('#m_title').value||null, bucket:'media', path, media_type:mt });
    if(error) return toast('Failed',error.message,'bad'); toast('Memory added ✨');
  });
  const tl=$('#tl_save'); if(tl) tl.addEventListener('click', async ()=>{
    if(!$('#tl_title').value||!$('#tl_date').value) return toast('Missing','Date and title required','bad');
    const { error }=await sb.from('timeline_events').insert({ event_date:$('#tl_date').value, title:$('#tl_title').value, description:$('#tl_desc').value||null });
    if(error) return toast('Failed',error.message,'bad'); toast('Moment added 💞'); $('#tl_title').value='';$('#tl_desc').value='';
  });
  const ps=$('#p_save'); if(ps) ps.addEventListener('click', async ()=>{
    const pp=getPlayerProfile(); if(!pp) return;
    const { error }=await sb.from('profiles').update({ display_name:$('#p_name').value, welcome_message:$('#p_welcome').value||null }).eq('id',pp.id);
    if(error) return toast('Failed',error.message,'bad'); toast('Saved'); await loadPlayerProfile();
  });
  const an=$('#an_save'); if(an) an.addEventListener('click', async ()=>{
    const b=$('#an_note').value.trim(); if(!b) return;
    const { error }=await sb.from('secret_notes').insert({ author_id:state.session.user.id, body:b });
    if(error) return toast('Failed',error.message,'bad'); toast('Note sent 💌'); $('#an_note').value='';
  });
}
async function loadPlayerProfile(){
  const { data }=await sb.from('profiles').select('*').eq('role','player').maybeSingle();
  state._playerProfile=data||null;
}

/* assign punishment modal (after reject) */
function openAssignModal(submissionId, feedback){
  const wrap=document.createElement('div'); wrap.className='overlay';
  wrap.innerHTML=`<div class="modal pop">
    <h2 style="font-size:26px">Reject & assign a forfeit 👑</h2>
    <p class="muted">She cannot retry until she completes this.</p>
    <label class="fld">Forfeit title</label><input class="input" id="pnTitle" placeholder="e.g. Sing our song">
    <label class="fld">Description</label><textarea class="input" id="pnDesc" placeholder="What must she do?"></textarea>
    <div class="row" style="gap:10px;margin-top:14px">
      <button class="btn danger" id="pnGo">Reject & assign</button>
      <button class="btn ghost" id="pnCancel">Cancel</button>
    </div></div>`;
  document.body.appendChild(wrap);
  $('#pnCancel').addEventListener('click',()=>wrap.remove());
  wrap.addEventListener('click',e=>{ if(e.target===wrap) wrap.remove(); });
  $('#pnGo').addEventListener('click', async ()=>{
    const title=$('#pnTitle').value.trim(), desc=$('#pnDesc').value.trim();
    if(!title||!desc) return toast('Missing','Add a title and description','bad');
    const go=$('#pnGo'); go.disabled=true; go.innerHTML='<span class="spin"></span>';
    await reviewSubmission(submissionId,false,feedback);
    await assignPunishment(submissionId,title,desc);
    wrap.remove();
  });
}

/* ============================================================
   GLOBAL WIRING (topbar, nav, notifications)
   ============================================================ */
function wireGlobal(){
  document.querySelectorAll('[data-nav]').forEach(n=>n.addEventListener('click',()=>navigate(n.dataset.nav)));
  document.querySelectorAll('[data-act]').forEach(n=>n.addEventListener('click',()=>topAct(n.dataset.act)));
}
async function navigate(v){
  if(v==='memories'||v==='timeline'||v==='notes'){ await loadExtras(); }
  if(v==='treasure'){ if(state.role==='player'){ await openTreasure(); return; } }
  if(v==='extras'){ await loadPlayerProfile(); }
  if(v==='content'){ state.editRiddle=null; }
  state.view=v; state.activeRiddle=null; render();
}
function topAct(a){
  if(a==='logout'){ sb.auth.signOut().then(()=>location.reload()); }
  else if(a==='theme'){ toggleTheme(); }
  else if(a==='notif'){ openNotif(); }
  else if(a==='music'){ toggleMusic(); }
  else if(a==='fullscreen'){ toggleFullscreen(); }
}
function paintNotif(){ // update badge without full re-render
  const b=document.querySelector('[data-act="notif"] .badge');
  const unread=state.notifications.filter(n=>!n.read).length;
  const btn=document.querySelector('[data-act="notif"]');
  if(!btn) return;
  if(unread){ if(b) b.textContent=unread; else { const s=document.createElement('span'); s.className='badge'; s.textContent=unread; btn.appendChild(s);} }
  else if(b) b.remove();
}
async function openNotif(){
  const wrap=document.createElement('div'); wrap.className='overlay';
  const items=state.notifications;
  wrap.innerHTML=`<div class="modal pop">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:26px">Notifications</h2>
    <button class="btn ghost sm" id="markAll">Mark all read</button></div>
    <div style="margin-top:12px">${items.length?items.map(n=>`<div class="card ${n.read?'':''}" style="margin-bottom:8px;${n.read?'opacity:.6':''}">
      <div class="row" style="justify-content:space-between"><b>${esc(n.title)}</b><span class="muted" style="font-size:12px">${fmtDate(n.created_at)}</span></div>
      ${n.body?`<div class="muted" style="font-size:14px">${esc(n.body)}</div>`:''}</div>`).join(''):'<div class="empty"><div class="e">🔔</div>No notifications yet.</div>'}</div>
    <button class="btn ghost block" id="closeNotif" style="margin-top:6px">Close</button></div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click',e=>{ if(e.target===wrap) wrap.remove(); });
  $('#closeNotif').addEventListener('click',()=>wrap.remove());
  $('#markAll').addEventListener('click', async ()=>{
    const ids=items.filter(n=>!n.read).map(n=>n.id); if(!ids.length) return;
    await sb.rpc('mark_notifications_read',{ _ids:ids }); await loadNotifications(); paintNotif(); wrap.remove();
  });
  // auto-mark read
  const ids=items.filter(n=>!n.read).map(n=>n.id);
  if(ids.length){ await sb.rpc('mark_notifications_read',{ _ids:ids }); await loadNotifications(); paintNotif(); }
}

/* theme / music / fullscreen / lightbox */
function applyTheme(){ const t=localStorage.getItem('th-theme')||'light'; document.documentElement.dataset.theme=t; }
function toggleTheme(){ const cur=document.documentElement.dataset.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=cur; localStorage.setItem('th-theme',cur); }
let audio=null;
function toggleMusic(){
  state.music=!state.music;
  if(state.music){
    if(!SONG_URL){ toast('No song set yet','Your MP3 will be added in a moment 🎵','bad'); state.music=false; render(); return; }
    if(!audio){ audio=new Audio(SONG_URL); audio.loop=true; audio.volume=.6; }
    audio.play().catch(()=>toast('Tap again','Browser blocked autoplay — tap the note once more.','bad'));
  } else if(audio){ audio.pause(); }
  render();
}
function toggleFullscreen(){ if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); } else { document.exitFullscreen?.(); } }
function lightbox(url){
  const wrap=document.createElement('div'); wrap.className='lightbox';
  const isV=/\.(mp4|mov|webm|m4v)/i.test(url);
  wrap.innerHTML=isV?`<video controls autoplay src="${url}"></video>`:`<img src="${url}">`;
  wrap.addEventListener('click',()=>wrap.remove()); document.body.appendChild(wrap);
}
